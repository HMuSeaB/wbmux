name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser 需要完整历史来生成 changelog。
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # 不能低于 1.24：Go 1.22 产出的 darwin/arm64 二进制缺 LC_UUID，
          # 在 macOS 26 上会被 dyld 拒绝（abort trap）。
          # 详见 ci.yml 里的说明。
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
