<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>wbmux · 嵌入面板</title>
<style>
  /* ---- 配色：暖灰 + 陶土橙 ----
     原来是 #0d1017 纯黑底配 #2dd4bf 青绿——那是 2024 年 AI 产品的默认长相，
     也是"一眼看出是 AI 做的"最直接来源。换成船板那套：
       · 背景不用纯黑，用带一点暖调的 #1F1E1D，层次靠亮度递进而不是描透明边框
       · 强调色用陶土橙 #D97757，只在真正需要指路的地方出现
       · 正文不用冷白 #e6e8ee，用微暖的 #E8E5E1，配暖底才不刺
     状态色也一并压暗：亮绿 #34d399 换成苔绿 #7FA573，红换砖红 #C25B4E。 */
  :root {
    --bg: #1F1E1D; --card: #262422; --card-2: #2B2A26;
    --border: rgba(255, 244, 232, 0.07);
    --ink-0: #E8E5E1; --ink-1: #C9C4BC; --ink-2: #9E988D; --ink-3: #736E65;
    --brand: #D97757; --brand-dim: rgba(217, 119, 87, 0.13);
    --ok: #7FA573; --bad: #C25B4E; --warn: #D9A354;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--ink-0);
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 12px; overflow-y: auto;
    /* 窄栏下任何子元素都不该把 body 撑宽：撑宽后右侧被裁，
       看起来就是"内容缺了一块"（2026-11-20 340px 实测）。 */
    overflow-x: hidden;
    max-width: 100vw;
  }
  /* 弹层内滚动条要细，别把 400px 的面板再挤窄 */
  body::-webkit-scrollbar { width: 6px; }
  body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 3px; }
  body::-webkit-scrollbar-track { background: transparent; }

  /* 可折叠卡片（端点区默认收起，给最近请求腾出高度） */
  details.card > summary { list-style: none; cursor: pointer; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "▾"; float: right; color: var(--ink-3); font-size: 9px; }
  code { font-family: "Cascadia Code", Consolas, monospace; }

  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .logo-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); flex: none; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.3px; }
  .live-pill {
    font-size: 10.5px; color: var(--ok); background: rgba(52,211,153,0.12);
    border: 1px solid rgba(52,211,153,0.25); border-radius: 999px; padding: 1px 8px;
  }
  .live-pill.stale {
    color: var(--warn); background: rgba(235,178,58,0.12);
    border-color: rgba(235,178,58,0.35);
  }
  /* 来源行：当前数字来自哪边（网关/直连·国内/国际），旧值时兼作"多久前"提示 */
  .src-line { font-size: 11px; color: var(--ink-2); margin: -4px 0 10px; min-height: 0; }
  .src-line .aged { color: var(--warn); }
  .head a {
    margin-left: auto; color: var(--ink-2); text-decoration: none; font-size: 11.5px;
    padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
  }
  .head a:hover { color: var(--brand); border-color: rgba(217,119,87,0.42); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  .card-title { font-size: 11px; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; }

  .clients { display: flex; flex-direction: column; gap: 6px; }

  /* 三格指标：上次请求 / 生成速率 / 今日用量 */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .metric {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; min-width: 0;
  }
  .m-val { display: block; font-size: 16px; font-weight: 680; color: var(--ink-0); letter-spacing: 0.2px; }
  .m-val.warn { color: var(--warn); }
  .m-val.bad { color: var(--bad); }
  .m-label { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }

  /* 最近请求：一行一条，只放"哪个模型 / 多大 / 多快 / 多久前" */
  .recent { display: flex; flex-direction: column; gap: 5px; }
  .recent-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; min-width: 0; }
  .r-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); flex: none; }
  .r-dot.bad { background: var(--bad); }
  .r-model { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-1); }
  .r-meta { flex: none; color: var(--ink-3); font-size: 10.5px; font-family: Consolas, monospace; }
  .recent-empty { color: var(--ink-3); font-size: 11px; }
  .client-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .client-row .name { color: var(--ink-1); }
  .client-row .pid { color: var(--ink-3); font-size: 10.5px; font-family: Consolas, monospace; }
  .st { margin-left: auto; font-size: 11px; display: flex; align-items: center; gap: 5px; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .st.on { color: var(--ok); } .st.on::before { background: var(--ok); }
  .st.off { color: var(--ink-3); }

  /* 额度：每档一行迷你余量条（国内包/国际包分开，绝不合并成总数） */
  .quota-model { font-size: 11.5px; margin-bottom: 8px; }
  .quota-model.warn { color: var(--warn); }
  .quota-model.bad { color: var(--bad); }
  .quota-rows { display: flex; flex-direction: column; gap: 7px; }
  .quota-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  /* 一周内清零：整行文字转琥珀色加粗，让"余额要没了"自己跳出来 */
  .quota-row.expiring .q-text { color: var(--warn); font-weight: 650; }
  .q-side { flex: none; color: var(--ink-1); width: 44px; }
  /* .q-bar/.q-fill 是旧的单条进度条：Usage Bar v2 改用下面的 dial + LED，
     但类名保留，回退时把 LED 段整体隐藏、换回 .q-bar 即回旧形态。 */
  .q-bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .q-fill { display: block; height: 100%; border-radius: 3px; background: var(--brand); }
  .q-fill.warn { background: var(--warn); }
  .q-text { flex: none; color: var(--ink-2); font-size: 10.5px; }
  /* ---- Usage Bar v2：dial + 20 格 LED（t3 fork 风格，暖色版） ----
     只上主包行，逐张积分卡行（.qcard）不动。dial 20px SVG 圆环，
     弧长 = 剩余%；LED 每格 5%，满格实色、半格 45% 透明、空格白 10%。
     着色与 Go 端 internal/embedstats.QuotaLevel 同口径（<20 黄、<10 红），
     pace under（省着用）才绿；默认白/灰，不越阈值不上色。
     到期文字单独一格（.q-tail）：快到期时琥珀加粗，用户要的是
     "这包啥时候过期、赶紧用完"，不能把它藏在灰色小字里。 */
  .q-dial { flex: none; width: 20px; height: 20px; }
  .q-led { flex: 1; display: flex; gap: 2px; min-width: 0; height: 10px; }
  .q-led i { flex: 1; min-width: 0; border-radius: 2px; background: rgba(255,255,255,0.10); }
  .q-led i.on { background: var(--ink-0); opacity: 0.8; }
  .q-led i.half { opacity: 0.45; }
  .q-led i.warn { background: var(--warn); opacity: 1; }
  .q-led i.bad { background: var(--bad); opacity: 1; }
  .q-led i.ok { background: var(--ok); opacity: 1; }
  .q-tail { flex: none; color: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .q-tail.hot { color: var(--warn); font-weight: 650; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    font-family: inherit; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card-2); color: var(--ink-0);
    padding: 8px 10px; font-size: 12px; line-height: 1.4; text-align: left;
    transition: border-color .15s, background .15s;
  }
  button:hover:not(:disabled) { border-color: rgba(217,119,87,0.45); }
  button:disabled { opacity: 0.55; cursor: wait; }
  button .sub { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
  /* 主按钮：陶土橙实心。原来是从 #14b8a6 到 #0d9488 的青绿渐变——
     渐变和高饱和青绿这两样合在一起，是"AI 味"的主要来源。
     实色 + 深色文字，跟船板的发送按钮一个路子（#D97757 底 / 深字）。 */
  button.primary {
    background: var(--brand); color: #221512;
    border: none; font-weight: 560;
  }
  button.primary:hover:not(:disabled) { background: #E08A6C; }
  button.primary .sub { color: rgba(34, 21, 18, 0.62); }
  button.wide { grid-column: 1 / -1; text-align: center; }

  .endpoint { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .endpoint code {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; color: var(--brand); background: rgba(217,119,87,0.10);
    padding: 5px 8px; border-radius: 6px;
  }
  .endpoint button { flex: none; padding: 4px 10px; font-size: 11px; }
  .ep-label { font-size: 11px; color: var(--ink-2); margin-top: 8px; }
  .ep-label:first-of-type { margin-top: 0; }

  .foot { color: var(--ink-3); font-size: 10.5px; text-align: center; margin-top: 4px; }

  .toast {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50;
    background: var(--card-2); border: 1px solid rgba(217,119,87,0.42); color: var(--ink-0);
    border-radius: 8px; padding: 9px 12px; font-size: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .toast.bad { border-color: rgba(248,113,113,0.5); }

  /* ---- 层次重构：主指标放大、卡片收紧、按使用频率排序 ---- */
  .hero { display: grid; grid-template-columns: 1.05fr 1.05fr 0.9fr; gap: 8px; margin-bottom: 8px; }
  .hero-cell { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; min-width: 0; }
  .hero-num { display: block; font-size: 19px; font-weight: 700; letter-spacing: 0.3px; color: var(--ink-0); line-height: 1.3; }
  .hero-cell.sub .hero-num { font-size: 16px; }
  .hero-num.warn { color: var(--warn); }
  .hero-num.bad { color: var(--bad); }
  .hero-label { display: block; font-size: 10px; color: var(--ink-3); margin-top: 1px; }
  .card { padding: 10px 12px; margin-bottom: 8px; }
  .card.tight { padding: 8px 12px; }
  .card.tight .client-row { font-size: 11.5px; }
  .actions { gap: 6px; }
  .actions button { padding: 7px 9px; font-size: 11.5px; border-radius: 8px; }
  .actions button .sub { font-size: 9.5px; margin-top: 1px; }
  /* 本月/累计 + 30 天柱子 */
  .stats-strip { display: flex; align-items: baseline; gap: 14px; margin: 0 2px 6px; font-size: 11px; color: var(--ink-3); }
  .stats-strip b { color: var(--ink-1); font-weight: 650; font-size: 12px; margin-left: 2px; }
  .stats-strip .strip-label { margin-left: auto; font-size: 10px; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 24px; margin: 0 2px 10px; }
  .spark i { flex: 1; min-width: 2px; background: rgba(217, 119, 87, 0.28); border-radius: 1px; }
  /* 当天那根用强调色，与"当前"语义一致；其余是陶土橙的低透明档，
     整排读起来是一个色系，不再跳出一片亮绿。 */
  .spark i.on { background: var(--brand); }
  /* 积分卡：逐张一行，进度条 + 已用/总量 */
  .qhead { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 4px; font-size: 10.5px; color: var(--ink-3); }
  .qhead b { color: var(--ink-1); font-weight: 600; font-size: 11.5px; }
  .qcard { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .qbar { flex: 1; height: 5px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
  /* 额度条：用低饱和的苔绿，不再用 #34d399 那种亮绿（在暖底上很跳） */
  .qbar i { display: block; height: 100%; background: #7FA573; border-radius: 3px; }
  .qbar i.low { background: var(--warn); }
  .qmeta { font-size: 10.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .qexp { font-size: 10px; color: var(--ink-3); min-width: 52px; font-variant-numeric: tabular-nums; }
  .qexp.hot { color: var(--warn); font-weight: 600; }
  .qmore { font-size: 10px; color: var(--ink-3); padding: 4px 0 2px 60px; }
  /* ---- 窄栏自适应 ----
     面板是嵌在客户端侧边的 iframe，宽度常常只有 300–360px。
     三列 grid 在这么窄的容器里会把每个格子压到 90px，标题折行、
     数字被挤成两行——这就是"整体太丑"的直接来源。

     ≤380px：指标与操作区改两列，hero 三格堆成单列；
     ≤300px：全部单列，并缩小字号与内边距，保证一屏看得到重点。 */
  @media (max-width: 380px) {
    body { padding: 10px; font-size: 12.5px; }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero > :first-child { grid-column: 1 / -1; }
    .card { padding: 10px; }
    /* 所有 grid 子项都必须能收缩，否则内容会把轨道撑开 */
    .metrics > *, .hero > *, .actions > * { min-width: 0; }
    /* 额度行窄栏下换行：dial 藏掉，LED 独占一行（每格仍 ≥10px），
       数字与到期文字留在第一行，不被 LED 挤出可视区。 */
    .quota-row { flex-wrap: wrap; }
    .q-dial { display: none; }
    .q-led { flex: 1 1 100%; order: 4; margin-top: 2px; }
  }
  @media (max-width: 300px) {
    .metrics, .hero, .actions { grid-template-columns: minmax(0, 1fr); }
    .metric .value, .hero-cell .v { font-size: 19px; }
    .qv-head, .qhead { flex-wrap: wrap; gap: 2px; }
  }
  /* ---- 主指标卡：唯一强调位 ----
     skill 的硬约束：一屏只有一个强调色、层级靠字号差 ≥4px。
     主数字 30px、标签 10.5px、次级数字 15px —— 三档拉开。
     深色底沿用客户端侧栏（浅底在这里会像贴上去的补丁），
     但强调色只用在主数字上，其余走灰阶。 */
  .ctx-hero {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    /* 窄栏下不能靠内容撑宽：撑开就会被裁掉右边 */
    max-width: 100%; min-width: 0; overflow: hidden;
  }
  .ctx-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
  .ctx-label { font-size: 10.5px; color: var(--ink-3); letter-spacing: .04em; }
  .ctx-sub { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx-value-wrap { display: flex; align-items: baseline; gap: 6px; margin: 6px 0 8px; min-width: 0; }
  .ctx-value { font-size: 30px; font-weight: 680; line-height: 1.1; color: var(--brand); letter-spacing: -.01em; }
  .ctx-value.warn { color: var(--warn); }
  .ctx-value.bad { color: var(--bad); }
  .ctx-limit { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .ctx-bar { height: 4px; background: var(--card-2); border-radius: 2px; overflow: hidden; }
  .ctx-bar i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 2px; transition: width .3s ease; }
  .ctx-bar i.warn { background: var(--warn); }
  .ctx-bar i.bad { background: var(--bad); }

  /* ---- 次级指标：一行三列，同字号同权重 ---- */
  .sub-stats {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 10px;
  }
  .sub-stat { background: var(--card); padding: 10px 12px; min-width: 0; }
  .sub-label { display: block; font-size: 10.5px; color: var(--ink-3); letter-spacing: .03em; }
  .sub-value {
    display: block; margin-top: 3px; font-size: 15px; font-weight: 620;
    color: var(--ink-0); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- 30 天柱：给一个上限刻度，否则只有一根柱子看不出量级 ---- */
  .spark-wrap { margin-bottom: 10px; }
  .spark-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10.5px; color: var(--ink-3); margin-bottom: 6px;
  }
  .spark-max { font-variant-numeric: tabular-nums; }

</style>
</head>
<body>

<div class="head">
  <span class="logo-dot"></span>
  <span class="brand">wbmux</span>
  <span class="live-pill" id="live">本机代理在线</span>
  <a id="full-link" href="#" target="_blank" rel="noopener">完整面板 ↗</a>
</div>

<!-- 主指标：一张卡承载最重要的信息（skill：唯一强调落在最重要的数上）。
     旧版是三张等宽卡、其中一张还是空的"—"，三块视觉权重一样，
     用户不知道该看哪个。现在上下文独占一块，其余降为下面的次级行。 -->
<div class="ctx-hero" id="ctx-hero">
  <div class="ctx-head">
    <span class="ctx-label">当前上下文</span>
    <span class="ctx-sub" id="m-ctx-sub">—</span>
  </div>
  <div class="ctx-value-wrap">
    <span class="ctx-value" id="m-ctx">—</span>
    <span class="ctx-limit" id="m-ctx-limit"></span>
  </div>
  <div class="ctx-bar"><i id="m-ctx-bar"></i></div>
</div>

<!-- 次级指标：一行三列，同等权重、同样字阶，不再有"空卡" -->
<div class="sub-stats">
  <div class="sub-stat">
    <span class="sub-label">今日 tokens</span>
    <span class="sub-value" id="m-today">—</span>
  </div>
  <div class="sub-stat">
    <span class="sub-label">本月</span>
    <span class="sub-value" id="m-month">—</span>
  </div>
  <div class="sub-stat">
    <span class="sub-label">累计</span>
    <span class="sub-value" id="m-total">—</span>
  </div>
</div>

<div class="spark-wrap">
  <div class="spark-head"><span>近 30 天</span><span class="spark-max" id="spark-max"></span></div>
  <div class="spark" id="spark"></div>
</div>

<div class="src-line" id="src-line" style="display:none"></div>

<div class="card" id="quota-card" style="display:none">
  <div class="card-title">额度</div>
  <div class="quota-model" id="quota-model" style="display:none"></div>
  <div class="quota-rows" id="quota-rows"></div>
</div>

<div class="card tight">
  <div class="clients">
    <div class="client-row">
      <span class="name">国内</span>
      <span class="pid" id="cn-pid"></span>
      <span class="st off" id="cn-st">检测中</span>
    </div>
    <div class="client-row">
      <span class="name">国际</span>
      <span class="pid" id="intl-pid"></span>
      <span class="st off" id="intl-st">检测中</span>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">操作</div>
  <div class="actions">
    <button class="primary" id="btn-inject">
      注入免费模型
      <span class="sub">→ 国内端</span>
    </button>
    <button id="btn-inject-back">
      反向注入
      <span class="sub">→ 国际端</span>
    </button>
    <button id="btn-both">
      智能双开
      <span class="sub">未开则启动</span>
    </button>
    <button id="btn-restart">
      重启客户端
      <span class="sub">让注入生效</span>
    </button>
  </div>
</div>

<div class="card">
  <div class="card-title">最近请求</div>
  <div class="recent" id="recent-list">
    <div class="recent-empty">加载中…</div>
  </div>
</div>

<details class="card">
  <summary class="card-title">本机端点（点击展开复制）</summary>
  <div class="ep-label">OpenAI 兼容 Base URL</div>
  <div class="endpoint">
    <code id="ep-openai"></code>
    <button data-copy="ep-openai">复制</button>
  </div>
  <div class="ep-label">免费联网搜索（Anthropic 协议）</div>
  <div class="endpoint">
    <code id="ep-search"></code>
    <button data-copy="ep-search">复制</button>
  </div>
</details>

<div class="foot">本机回环免密调用 · 完整功能请打开完整面板</div>

<script>
(function () {
  var TOKEN = new URLSearchParams(location.search).get("t") || "";
  document.getElementById("full-link").href = "/?t=" + encodeURIComponent(TOKEN);

  document.getElementById("ep-openai").textContent = location.origin + "/v1";
  document.getElementById("ep-search").textContent = location.origin + "/v1/search/messages";

  function toast(msg, bad) {
    var t = document.createElement("div");
    t.className = "toast" + (bad ? " bad" : "");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, bad ? 6000 : 3200);
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "X-Wbmux-Token": TOKEN }, opts.headers || {});
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return { error: "响应无法解析" }; }).then(function (data) {
        if (!res.ok) throw new Error(data && data.error ? data.error : "HTTP " + res.status);
        return data;
      });
    });
  }
  function post(path, body) {
    return api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
  }

  function setClient(side, stat) {
    var st = document.getElementById(side + "-st");
    var pid = document.getElementById(side + "-pid");
    if (stat && stat.running) {
      st.className = "st on";
      st.textContent = "运行中";
      pid.textContent = (stat.pids && stat.pids.length) ? "PID " + stat.pids[0] : "";
    } else {
      st.className = "st off";
      st.textContent = "未运行";
      pid.textContent = "";
    }
  }
  function refreshStatus() {
    api("/api/clients/status").then(function (res) {
      var c = (res && res.clients) || {};
      setClient("cn", c.cn);
      setClient("intl", c.intl);
    }).catch(function () {});
  }

  // ---------- 轮询节流 ----------
  // 客户端状态是分钟级变化的数据，15 秒一轮足够；弹层藏起来（display:none
  // 的 iframe 在后台标签页里）时两路轮询都停掉，切回来立刻拉一次。
  // stats 失败时退避 5s → 15s → 30s，成功即复位到 5s。
  var statsTimer = null, clientsTimer = null, statsFails = 0;
  var statsBackoff = [5000, 15000, 30000];
  function scheduleStats(delay) {
    clearTimeout(statsTimer);
    statsTimer = setTimeout(function () { loadStats(); }, delay);
  }
  function startPolling() {
    refreshStatus();
    clearInterval(clientsTimer);
    clientsTimer = setInterval(refreshStatus, 15000);
    loadStats();
  }
  function stopPolling() {
    clearTimeout(statsTimer);
    clearInterval(clientsTimer);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopPolling(); else startPolling();
  });
  startPolling();

  // ---------- 胶囊同款指标 ----------
  // 五个指标都来自 /api/embed/stats（请求级快照）：上次请求、生成速率、今日用量。
  // 上次请求超过 256000 转黄、512000 转红——1M 上下文的模型很容易悄悄吃满。
  // 阈值与 stale 分档的唯一口径在 Go 端 internal/embedstats，这里的数字
  // 由 internal/webui 的 TestEmbedHTMLThresholds 锁死一致，别手改一边。
  var CTX_WARN = 256000, CTX_BAD = 512000;
  var STALE_AGED_SEC = 1800, STALE_IDLE_SEC = 7200; // 30 分钟变旧值，120 分钟才算空闲
  // 额度告警阈值：与 Go 端 internal/embedstats.QuotaLevel 一致（<20 黄、<10 红），
  // 改一边忘另一边时面板与胶囊会先对不上，别手改一边。
  // 注意 TestEmbedHTMLThresholds 只锁上下文阈值（256000/512000）与 stale
  // 分档，额度阈值由 Go 端 TestQuotaLevel 与这里的常量共同钉住。
  var QUOTA_WARN = 20, QUOTA_BAD = 10;
  // 额度等级：百分比口径 + pace ahead（烧得比时间快）至少黄；
  // aged 时调用方传 ""，旧值不着色。
  function quotaLevel(pct, pace) {
    if (pct < QUOTA_BAD) return "bad";
    if (pct < QUOTA_WARN || pace === "ahead") return "warn";
    if (pace === "under") return "ok";
    return "";
  }
  // 圆形 dial：20px SVG（t3 QuotaArcDial 同款几何：viewBox 16、半径 5.6、
  // 线宽 1.9、弧尖小珠）。弧长 = 剩余%，颜色与 LED 同口径。
  function dialSVG(pct, level) {
    var r = 5.6, c = 2 * Math.PI * r;
    var color = level === "bad" ? "#C25B4E" : level === "warn" ? "#D9A354" : level === "ok" ? "#7FA573" : "#E8E5E1";
    var p = Math.max(0, Math.min(100, pct));
    var off = c * (1 - p / 100);
    var ang = (p / 100 * 360 - 90) * Math.PI / 180;
    var bx = 8 + r * Math.cos(ang), by = 8 + r * Math.sin(ang);
    return '<svg class="q-dial" viewBox="0 0 16 16" aria-hidden="true">'
      + '<circle cx="8" cy="8" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.9"/>'
      + '<circle cx="8" cy="8" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '" transform="rotate(-90 8 8)"/>'
      + '<circle cx="' + bx.toFixed(2) + '" cy="' + by.toFixed(2) + '" r="1.5" fill="#1F1E1D" stroke="' + color + '"/></svg>';
  }
  // 20 格 LED：每格 5%，满格实色、半格 45% 透明、空格白 10%。
  function ledHTML(pct, level) {
    var filled = Math.max(0, Math.min(100, pct)) / 5;
    var full = Math.floor(filled);
    var html = '<span class="q-led">';
    for (var i = 0; i < 20; i++) {
      var cls = "";
      if (i < full) cls = "on" + (level ? " " + level : "");
      else if (i === full && filled % 1 >= 0.5) cls = "half" + (level ? " " + level : "");
      html += '<i class="' + cls + '"></i>';
    }
    return html + "</span>";
  }
  // 去掉无意义的小数尾零：1000000 显示 1M 而不是 1.00M，
  // 1.5M 保留一位。上限这类整数最容易被 ".00" 弄脏。
  // 千分位 + 最多两位小数：积分卡上 4893.78000056 这种浮点尾巴要收掉。
  // "2026-11-22 13:31:41" → "11/22"；解析不了原样返回。
  function shortDate(v) {
    var m = /^\d{4}-(\d{2})-(\d{2})/.exec(v || "");
    return m ? m[1] + "/" + m[2] : (v ? "—" : "—");
  }
  function fmtNum(n) {
    var v = Math.round(n * 100) / 100;
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function trimZero(v) {
    return String(v).replace(/\.0+$/, "").replace(/(\.\d)0+$/, "$1");
  }
  function compact(n) {
    if (n >= 1000000) return trimZero((n / 1000000).toFixed(2)) + "M";
    if (n >= 10000) return Math.round(n / 1000) + "k";
    if (n >= 1000) return trimZero((n / 1000).toFixed(1)) + "k";
    return String(n);
  }
  function sourceLabel(source, side) {
    if (source === "local") {
      if (side === "cn") return "国内直连";
      if (side === "intl") return "国际直连";
      return "直连";
    }
    return "网关";
  }
  function setSrcLine(last) {
    var line = document.getElementById("src-line");
    if (!last || !last.model) { line.style.display = "none"; line.textContent = ""; return; }
    line.style.display = "";
    line.textContent = "当前数字来自：" + sourceLabel(last.source, last.side) + " · " + last.model;
  }
  function setStaleMark(aged) {
    var pill = document.getElementById("live");
    if (aged) {
      pill.classList.add("stale");
      pill.textContent = "数据过期";
    } else {
      pill.classList.remove("stale");
      pill.textContent = "本机代理在线";
    }
  }
  function loadStats() {
    return api("/api/embed/stats").then(function (s) {
      statsFails = 0;
      setStaleMark(false);
      var last = (s && s.last) || {};
      // 新鲜度三档（与 Go 端 internal/embedstats 一致，前端用 ageSec 兜底）：
      // 30 分钟内正常显示；30–120 分钟显示旧值 + 多久前、不着色；
      // 超过 120 分钟才显示"空闲"。旧数据直接抹掉会丢信息，当"现在"又会误导人。
      var freshness = last.freshness
        || ((last.ageSec || 0) > STALE_IDLE_SEC ? "idle"
          : ((last.ageSec || 0) > STALE_AGED_SEC ? "aged" : "fresh"));
      var idle = freshness === "idle";
      var aged = freshness === "aged";
      // 主指标：大数字只放"已用"，上限单独一档弱化显示；下面一条进度条
      // 把"占了多少"变成一眼能看的形状（skill：层级靠字号与灰度）。
      var ctx = document.getElementById("m-ctx");
      var ctxLimit = document.getElementById("m-ctx-limit");
      var ctxBar = document.getElementById("m-ctx-bar");
      var ctxSub = document.getElementById("m-ctx-sub");
      if (idle) {
        ctx.textContent = "空闲";
        ctxLimit.textContent = "";
        ctxBar.style.width = "0%";
        ctxBar.className = "";
        ctxSub.textContent = "超过 2 小时没有新请求";
      } else if (!last.promptTokens) {
        ctx.textContent = "—";
        ctxLimit.textContent = "";
        ctxBar.style.width = "0%";
        ctxSub.textContent = "还没有请求";
      } else {
        ctx.textContent = compact(last.promptTokens);
        var ratio = last.contextLimit ? last.promptTokens / last.contextLimit : 0;
        ctxLimit.textContent = last.contextLimit ? "/ " + compact(last.contextLimit) : "";
        ctxBar.style.width = Math.max(0, Math.min(100, ratio * 100)) + "%";
        ctxBar.className = (last.promptTokens >= CTX_BAD ? "bad" : (last.promptTokens >= CTX_WARN ? "warn" : ""));
        ctxSub.textContent = last.contextLimit
          ? "已用 " + Math.round(ratio * 100) + "%"
          : "";
      }
      var rate = idle ? 0
        : (last.tokPerSec ? Math.round(last.tokPerSec) + "/s"
          : (last.ttftMs ? "首字 " + (last.ttftMs / 1000).toFixed(1) + "s" : ""));
      // 速率没有独立卡片了，并入主卡副标题：有值才显示。
      if (rate && !idle && !aged) {
        ctxSub.textContent = (ctxSub.textContent ? ctxSub.textContent + " · " : "") + rate;
      }
      // 主卡 hover 明细：只挂已有字段（TTFT/速率/模型/来源），不编没有的
      // （缓存命中、think token 这些记录里没有）。
      var hero = document.getElementById("ctx-hero");
      if (hero) {
        var hbits = [];
        if (last.ttftMs) hbits.push("TTFT " + (last.ttftMs / 1000).toFixed(1) + "s");
        if (last.tokPerSec) hbits.push(Math.round(last.tokPerSec) + "/s");
        if (last.model) hbits.push(last.model);
        if (last.source) hbits.push(sourceLabel(last.source, last.side));
        hero.title = hbits.length ? hbits.join(" · ") : "";
      }
      var today = (s && s.today) || {};
      document.getElementById("m-today").textContent = today.tokens ? compact(today.tokens) : "—";
      var totals = (s && s.totals) || {};
      document.getElementById("m-month").textContent = totals.month ? compact(totals.month) : "—";
      document.getElementById("m-total").textContent = totals.total ? compact(totals.total) : "—";
      renderSpark(s && s.daily);
      // 标出这 30 天的峰值：只有一根柱子时，没有刻度看不出量级。
      var mx = document.getElementById("spark-max");
      if (mx) {
        var daily = (s && s.daily) || [];
        var peak = 0;
        daily.forEach(function (d) { if (d && d.tokens > peak) peak = d.tokens; });
        mx.textContent = peak ? "峰值 " + compact(peak) : "";
      }
      var line = document.getElementById("src-line");
      if (aged) {
        line.style.display = "";
        line.innerHTML = "";
        var span = document.createElement("span");
        span.className = "aged";
        span.textContent = "数据为 " + ago(last.ageSec) + "前 · 仅供参考";
        line.appendChild(span);
      } else if (idle) {
        line.style.display = "none";
        line.textContent = "";
      } else {
        setSrcLine(last);
      }
      renderRecent((s && s.recent) || []);
      renderQuota(s && s.quota, aged);
      scheduleStats(5000);
    }).catch(function () {
      // 失败不吞旧数：连续失败 ≥2 次（约 10 秒）就把顶栏药丸标成"数据过期"，
      // 旧数字仍保留在原位，但不再冒充实时数据；恢复成功即清标记。
      statsFails++;
      if (statsFails >= 2) setStaleMark(true);
      scheduleStats(statsBackoff[Math.min(statsFails - 1, statsBackoff.length - 1)]);
    });
  }

  // 多久前：只给粗粒度，精确到分钟对这个用途没意义。
  function ago(sec) {
    if (!sec || sec < 60) return "刚刚";
    if (sec < 3600) return Math.floor(sec / 60) + "m";
    if (sec < 86400) return Math.floor(sec / 3600) + "h";
    return Math.floor(sec / 86400) + "d";
  }

  // 近 30 天用量柱子：按当期最大值归一化。没有记录的日子也留 2px 底，
  // 避免"那天没用"和"没有数据"在图上看起来一样。
  function renderSpark(days) {
    var el = document.getElementById("spark");
    el.textContent = "";
    if (!days || !days.length) return;
    var max = 0;
    days.forEach(function (d) { if (d.tokens > max) max = d.tokens; });
    days.forEach(function (d) {
      var bar = document.createElement("i");
      bar.style.height = (max > 0 ? Math.max(2, Math.round((d.tokens / max) * 24)) : 2) + "px";
      if (d.tokens > 0) bar.className = "on";
      bar.title = d.date + " · " + compact(d.tokens);
      el.appendChild(bar);
    });
  }

  function renderRecent(rows) {
    var list = document.getElementById("recent-list");
    list.textContent = "";
    if (!rows.length) {
      var empty = document.createElement("div");
      empty.className = "recent-empty";
      empty.textContent = "还没有经过本机网关的请求";
      list.appendChild(empty);
      return;
    }
    rows.slice(0, 5).forEach(function (r) {
      var row = document.createElement("div");
      row.className = "recent-row";

      var dot = document.createElement("span");
      dot.className = "r-dot" + (r.ok ? "" : " bad");

      var name = document.createElement("span");
      name.className = "r-model";
      name.textContent = r.model || "未知模型";
      name.title = r.model || "";

      var meta = document.createElement("span");
      meta.className = "r-meta";
      var bits = [];
      if (r.promptTokens) bits.push(compact(r.promptTokens));
      if (r.tokPerSec) bits.push(Math.round(r.tokPerSec) + "/s");
      // 行尾标来源：网关 / 国内直连 / 国际直连（Go 端 source/side 字段）。
      if (r.source) bits.push(sourceLabel(r.source, r.side));
      bits.push(ago(r.ageSec));
      meta.textContent = bits.join(" · ");

      row.appendChild(dot);
      row.appendChild(name);
      row.appendChild(meta);
      list.appendChild(row);
    });
  }
  // 额度：当前模型的限流态 + 两档主包余量（/api/embed/stats 的 quota 段）。
  // 没数据的档位后端直接省略，前端不渲染，绝不显示 0%——"没数据"和
  // "用完了"是两回事。周期文案是后端原样带过来的 ExpiryRuleZh /
  // CycleEndTime，这里只照抄，不自己编。
  function quotaTime(q) {
    if (!q) return "";
    if (q.untilMs) {
      var d = new Date(q.untilMs);
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }
    var m = /(\d{2}):(\d{2}):\d{2}/.exec(q.untilText || "");
    return m ? m[1] + ":" + m[2] : "";
  }
  function renderQuota(quota, aged) {
    var card = document.getElementById("quota-card");
    var rows = document.getElementById("quota-rows");
    var modelLine = document.getElementById("quota-model");
    var pkgs = (quota && quota.packages) || [];
    var model = quota && quota.model;
    if (!pkgs.length && !model) {
      card.style.display = "none";
      rows.textContent = "";
      modelLine.style.display = "none";
      modelLine.textContent = "";
      return;
    }
    card.style.display = "";
    if (model && (model.state === "rate_limited" || model.state === "exhausted")) {
      modelLine.style.display = "";
      modelLine.className = "quota-model " + (model.state === "exhausted" ? "bad" : "warn");
      var t = quotaTime(model);
      modelLine.textContent = model.state === "exhausted"
        ? model.model + " 额度用尽"
        : model.model + " 限流" + (t ? "，" + t + " 恢复" : "");
    } else {
      modelLine.style.display = "none";
      modelLine.textContent = "";
    }
    rows.textContent = "";
    pkgs.forEach(function (p) {
      // 多卡档位（国内的"平台奖励积分"）：逐张列。合并成一行会把
      // "哪张还剩多少"吃掉，而这恰恰是用户打开面板要看的。
      if (p.cards && p.cards.length) {
        var head = document.createElement("div");
        head.className = "qhead";
        var hb = document.createElement("b");
        hb.textContent = (p.side === "intl" ? "国际" : "国内") + " · " + p.cards.length + " 张卡";
        var hs = document.createElement("span");
        var sumT = 0, sumU = 0;
        p.cards.forEach(function (c) { sumT += c.total; sumU += c.used; });
        hs.textContent = "已用 " + fmtNum(sumU) + " / " + fmtNum(sumT);
        head.appendChild(hb);
        head.appendChild(hs);
        rows.appendChild(head);

        // 卡可能有几十张（签到每天发一张），面板放不下，按到期日聚合。
        var groups = [];
        var byDay = {};
        p.cards.forEach(function (c) {
          var d = shortDate(c.expiresAt);
          var g = byDay[d];
          if (!g) {
            g = byDay[d] = { day: d, count: 0, total: 0, used: 0, daysLeft: c.daysLeft, expiresAt: c.expiresAt };
            groups.push(g);
          }
          g.count += 1;
          g.total += c.total;
          g.used += c.used;
        });

        // 用尽的组不占位（余额为 0 的卡看一眼就知道没了），最多列 5 组，
        // 其余折成一行"还有 N 组"——面板高度有限，最近到期的才是要看的。
        var live = groups.filter(function (g) { return g.total - g.used > 0; });
        var rest = live.length - 5;
        var restSum = 0;
        live.slice(5).forEach(function (g) { restSum += g.total - g.used; });

        live.slice(0, 5).forEach(function (g) {
          var pct = g.total > 0 ? Math.max(0, Math.min(100, (g.total - g.used) / g.total * 100)) : 0;
          var cardEl = document.createElement("div");
          cardEl.className = "qcard";

          // 到期日放最左：多张卡时，先看"哪张先没"比看用量更要紧。
          var ce = document.createElement("span");
          var hot = g.daysLeft > 0 && g.daysLeft <= 3;
          ce.className = "qexp" + (hot ? " hot" : "");
          ce.textContent = g.day + (g.count > 1 ? " ×" + g.count : "");
          ce.title = g.expiresAt + (g.daysLeft ? " · 还有 " + g.daysLeft + " 天" : " · 已到期");

          var cb = document.createElement("div");
          cb.className = "qbar";
          var cf = document.createElement("i");
          cf.style.width = pct + "%";
          if (pct < 20) cf.className = "low";
          cb.appendChild(cf);

          var ct = document.createElement("span");
          ct.className = "qmeta";
          ct.textContent = fmtNum(g.used) + " / " + fmtNum(g.total);

          cardEl.appendChild(ce);
          cardEl.appendChild(cb);
          cardEl.appendChild(ct);
          rows.appendChild(cardEl);
        });

        if (rest > 0) {
          var more = document.createElement("div");
          more.className = "qmore";
          more.textContent = "还有 " + rest + " 组 · " + fmtNum(restSum) + " 积分";
          rows.appendChild(more);
        }
        return;
      }

      var row = document.createElement("div");
      row.className = "quota-row";
      // aged 时不着色：旧值按快照显示，但不配报警（与 Go 端 Level 一致）。
      var level = aged ? "" : quotaLevel(p.percent, p.pace);

      var side = document.createElement("span");
      side.className = "q-side";
      side.textContent = p.side === "intl" ? "国际包" : "国内包";
      row.appendChild(side);

      // dial + LED：只上主包行；horizon rail 不做（2026-11-22 用户定）——
      // 用户只需要知道何时过期、赶紧用完，到期文字在行尾单独一格，不藏。
      row.insertAdjacentHTML("beforeend", dialSVG(p.percent, level));
      row.insertAdjacentHTML("beforeend", ledHTML(p.percent, level));

      var text = document.createElement("span");
      text.className = "q-text";
      // 有原始积分值时优先给"剩余 / 总量"——百分比看不出还剩多少分。
      text.textContent = (p.total
        ? fmtNum(p.remain) + " / " + fmtNum(p.total)
        : "剩余 " + p.percent.toFixed(1) + "%");

      // 到期文字单独一格：有到期信息就显示天数，"X 天后重置"（普通色）；
      // 一周内清零且还有余额，换成"X 天后清零"并转琥珀色加粗。余额为 0
      // 也显示天数——用户需要知道什么时候能重新有额度，但不再强调
      // （已经用尽）。没有天数时退回周期文案原文，照抄不编。
      var tail = document.createElement("span");
      tail.className = "q-tail";
      if (p.daysLeft > 0) {
        var hot = p.expiring && p.percent > 0;
        tail.textContent = hot ? p.daysLeft + " 天后清零" : p.daysLeft + " 天后重置";
        if (hot) {
          tail.className = "q-tail hot";
          row.className = "quota-row expiring";
        }
      } else if (p.cycleText) {
        tail.textContent = p.cycleText;
      }

      row.appendChild(text);
      if (tail.textContent) row.appendChild(tail);
      rows.appendChild(row);
    });
  }

  function bind(id, fn) {
    var btn = document.getElementById(id);
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      btn.disabled = true;
      var done = function () { btn.disabled = false; };
      fn(done, btn);
    });
  }

  bind("btn-inject", function (done) {
    post("/api/inject-custom-models").then(function (res) {
      toast((res.note || "注入完成") + "（新增 " + (res.added || 0) + " 个），重启国内端后生效");
      done();
    }).catch(function (e) { toast("注入失败：" + e.message, true); done(); });
  });

  bind("btn-inject-back", function (done) {
    post("/api/inject-cn-into-intl").then(function (res) {
      toast((res.note || "反向注入完成") + "（共 " + (res.added || 0) + " 个）");
      done();
    }).catch(function (e) { toast("反向注入失败：" + e.message, true); done(); });
  });

  bind("btn-both", function (done) {
    post("/api/launch-both").then(function (res) {
      var parts = (res.results || []).map(function (r) {
        var name = r.side === "cn" ? "国内" : "国际";
        if (r.alreadyRunning) return name + "已在跑";
        return name + (r.ok ? "已启动" : "失败:" + (r.err || "?"));
      });
      toast(parts.join("；") || "双开完成");
      refreshStatus();
      done();
    }).catch(function (e) { toast("双开失败：" + e.message, true); done(); });
  });

  bind("btn-restart", function (done) {
    if (!confirm("会先关闭再重启国内客户端。\n当前对话与未保存内容可能中断，继续吗？")) { done(); return; }
    post("/api/restart-client", { target: "cn", native: true }).then(function (pv) {
      toast("已重启国内客户端" + (pv.killed ? "（关闭旧进程 " + pv.killed + " 个）" : ""));
      refreshStatus();
      done();
    }).catch(function (e) { toast("重启失败：" + e.message, true); done(); });
  });

  document.querySelectorAll("[data-copy]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var text = document.getElementById(btn.getAttribute("data-copy")).textContent;
      function ok() { toast("已复制：" + text); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, function () { fallback(); });
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); ok(); } catch (e) { toast("复制失败，请手动选择", true); }
        ta.remove();
      }
    });
  });
})();
</script>
</body>
</html>
