name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 格式、静态检查、跨平台构建。
  #
  # 构建这一项刻意覆盖全部目标平台：wbmux 的平台差异集中在安装探测
  # （Windows 走注册表，其它平台走文件系统），漏掉某个平台
  # 很容易到交叉编译时才暴露。
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Go 1.22 的链接器不给 darwin/arm64 二进制写 LC_UUID，而 macOS 26
      # 的 dyld 要求这个 load command，缺了就直接 abort trap：
      #     dyld: missing LC_UUID load command
      #     signal: abort trap
      # 实测（解析 Mach-O 的 load commands）：
      #     go1.22 → 无 LC_UUID    go1.24 → 有 LC_UUID
      # 所以最低只到 1.24，别往下降。
      #
      # 这个坑一直存在，只是被 Go 的构建缓存遮住了——缓存命中时测试二进制
      # 不会在 runner 上真正执行。一旦缓存失效（改了代码），它就会冒出来。
      #
      # 缓存键用 go.mod 而不是默认的 go.sum：本项目零第三方依赖，
      # 根本没有 go.sum，用默认值会每次报 "Dependencies file is not found"，
      # 缓存等于没开。
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.mod

      # gofmt 只在 Linux 上跑：Windows 下它输出的路径带反斜杠，
      # 与脚本里的比较容易对不上。格式问题与平台无关，查一遍就够。
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 跨平台构建
        shell: bash
        run: |
          set -e
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "构建 $target"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -o /dev/null ./cmd/wbmux
          done

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # 同 build 作业：Go 1.22 产出的 darwin/arm64 二进制缺 LC_UUID，
          # 在 macOS 26 上会 abort trap。见文件上方说明。
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.mod

      - name: go test
        run: go test ./...

  # 安装探测只在 Windows 上走注册表，这里单独跑一遍完整明细，
  # 方便排查平台差异。
  detect:
    name: 安装探测（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.mod

      - name: 探测相关测试
        run: go test -v ./internal/variant/... ./internal/doctor/...
