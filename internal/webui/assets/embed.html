<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>wbmux · 嵌入面板</title>
<style>
  :root {
    --bg: #0d1017; --card: #161a23; --card-2: #1c212b;
    --border: rgba(255,255,255,0.08);
    --ink-0: #e6e8ee; --ink-1: #c3c9d4; --ink-2: #9aa3b2; --ink-3: #6b7484;
    --brand: #2dd4bf; --brand-dim: rgba(45,212,191,0.14);
    --ok: #34d399; --bad: #f87171; --warn: #ebb23a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink-0);
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 12px; overflow-y: auto;
  }
  /* 弹层内滚动条要细，别把 400px 的面板再挤窄 */
  body::-webkit-scrollbar { width: 6px; }
  body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 3px; }
  body::-webkit-scrollbar-track { background: transparent; }

  /* 可折叠卡片（端点区默认收起，给最近请求腾出高度） */
  details.card > summary { list-style: none; cursor: pointer; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "▾"; float: right; color: var(--ink-3); font-size: 9px; }
  code { font-family: "Cascadia Code", Consolas, monospace; }

  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .logo-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); flex: none; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.3px; }
  .live-pill {
    font-size: 10.5px; color: var(--ok); background: rgba(52,211,153,0.12);
    border: 1px solid rgba(52,211,153,0.25); border-radius: 999px; padding: 1px 8px;
  }
  .live-pill.stale {
    color: var(--warn); background: rgba(235,178,58,0.12);
    border-color: rgba(235,178,58,0.35);
  }
  /* 来源行：当前数字来自哪边（网关/直连·国内/国际），旧值时兼作"多久前"提示 */
  .src-line { font-size: 11px; color: var(--ink-2); margin: -4px 0 10px; min-height: 0; }
  .src-line .aged { color: var(--warn); }
  .head a {
    margin-left: auto; color: var(--ink-2); text-decoration: none; font-size: 11.5px;
    padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
  }
  .head a:hover { color: var(--brand); border-color: rgba(45,212,191,0.4); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  .card-title { font-size: 11px; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; }

  .clients { display: flex; flex-direction: column; gap: 6px; }

  /* 三格指标：上次请求 / 生成速率 / 今日用量 */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .metric {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; min-width: 0;
  }
  .m-val { display: block; font-size: 16px; font-weight: 680; color: var(--ink-0); letter-spacing: 0.2px; }
  .m-val.warn { color: var(--warn); }
  .m-val.bad { color: var(--bad); }
  .m-label { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }

  /* 最近请求：一行一条，只放"哪个模型 / 多大 / 多快 / 多久前" */
  .recent { display: flex; flex-direction: column; gap: 5px; }
  .recent-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; min-width: 0; }
  .r-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); flex: none; }
  .r-dot.bad { background: var(--bad); }
  .r-model { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-1); }
  .r-meta { flex: none; color: var(--ink-3); font-size: 10.5px; font-family: Consolas, monospace; }
  .recent-empty { color: var(--ink-3); font-size: 11px; }
  .client-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .client-row .name { color: var(--ink-1); }
  .client-row .pid { color: var(--ink-3); font-size: 10.5px; font-family: Consolas, monospace; }
  .st { margin-left: auto; font-size: 11px; display: flex; align-items: center; gap: 5px; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .st.on { color: var(--ok); } .st.on::before { background: var(--ok); }
  .st.off { color: var(--ink-3); }

  /* 额度：每档一行迷你余量条（国内包/国际包分开，绝不合并成总数） */
  .quota-model { font-size: 11.5px; margin-bottom: 8px; }
  .quota-model.warn { color: var(--warn); }
  .quota-model.bad { color: var(--bad); }
  .quota-rows { display: flex; flex-direction: column; gap: 7px; }
  .quota-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  /* 一周内清零：整行文字转琥珀色加粗，让"余额要没了"自己跳出来 */
  .quota-row.expiring .q-text { color: var(--warn); font-weight: 650; }
  .q-side { flex: none; color: var(--ink-1); width: 44px; }
  .q-bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .q-fill { display: block; height: 100%; border-radius: 3px; background: var(--brand); }
  .q-fill.warn { background: var(--warn); }
  .q-text { flex: none; color: var(--ink-2); font-size: 10.5px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    font-family: inherit; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card-2); color: var(--ink-0);
    padding: 8px 10px; font-size: 12px; line-height: 1.4; text-align: left;
    transition: border-color .15s, background .15s;
  }
  button:hover:not(:disabled) { border-color: rgba(45,212,191,0.45); }
  button:disabled { opacity: 0.55; cursor: wait; }
  button .sub { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
  button.primary {
    background: linear-gradient(135deg, #14b8a6, #0d9488); color: #04211d;
    border: none; font-weight: 650;
  }
  button.primary .sub { color: rgba(4,33,29,0.65); }
  button.wide { grid-column: 1 / -1; text-align: center; }

  .endpoint { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .endpoint code {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; color: var(--brand); background: rgba(45,212,191,0.07);
    padding: 5px 8px; border-radius: 6px;
  }
  .endpoint button { flex: none; padding: 4px 10px; font-size: 11px; }
  .ep-label { font-size: 11px; color: var(--ink-2); margin-top: 8px; }
  .ep-label:first-of-type { margin-top: 0; }

  .foot { color: var(--ink-3); font-size: 10.5px; text-align: center; margin-top: 4px; }

  .toast {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50;
    background: #1f2937; border: 1px solid rgba(45,212,191,0.4); color: var(--ink-0);
    border-radius: 8px; padding: 9px 12px; font-size: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .toast.bad { border-color: rgba(248,113,113,0.5); }

  /* ---- 层次重构：主指标放大、卡片收紧、按使用频率排序 ---- */
  .hero { display: grid; grid-template-columns: 1.05fr 1.05fr 0.9fr; gap: 8px; margin-bottom: 8px; }
  .hero-cell { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; min-width: 0; }
  .hero-num { display: block; font-size: 19px; font-weight: 700; letter-spacing: 0.3px; color: var(--ink-0); line-height: 1.3; }
  .hero-cell.sub .hero-num { font-size: 16px; }
  .hero-num.warn { color: var(--warn); }
  .hero-num.bad { color: var(--bad); }
  .hero-label { display: block; font-size: 10px; color: var(--ink-3); margin-top: 1px; }
  .card { padding: 10px 12px; margin-bottom: 8px; }
  .card.tight { padding: 8px 12px; }
  .card.tight .client-row { font-size: 11.5px; }
  .actions { gap: 6px; }
  .actions button { padding: 7px 9px; font-size: 11.5px; border-radius: 8px; }
  .actions button .sub { font-size: 9.5px; margin-top: 1px; }
  /* 本月/累计 + 30 天柱子 */
  .stats-strip { display: flex; align-items: baseline; gap: 14px; margin: 0 2px 6px; font-size: 11px; color: var(--ink-3); }
  .stats-strip b { color: var(--ink-1); font-weight: 650; font-size: 12px; margin-left: 2px; }
  .stats-strip .strip-label { margin-left: auto; font-size: 10px; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 24px; margin: 0 2px 10px; }
  .spark i { flex: 1; min-width: 2px; background: rgba(56, 225, 196, 0.26); border-radius: 1px; }
  .spark i.on { background: var(--ok); }
</style>
</head>
<body>

<div class="head">
  <span class="logo-dot"></span>
  <span class="brand">wbmux</span>
  <span class="live-pill" id="live">本机代理在线</span>
  <a id="full-link" href="#" target="_blank" rel="noopener">完整面板 ↗</a>
</div>

<div class="hero">
  <div class="hero-cell">
    <span class="hero-num" id="m-ctx">—</span>
    <span class="hero-label">上下文</span>
  </div>
  <div class="hero-cell">
    <span class="hero-num" id="m-today">—</span>
    <span class="hero-label">今日 tokens</span>
  </div>
  <div class="hero-cell sub">
    <span class="hero-num" id="m-rate">—</span>
    <span class="hero-label">生成速率</span>
  </div>
</div>

<div class="stats-strip">
  <span>本月 <b id="m-month">—</b></span>
  <span>累计 <b id="m-total">—</b></span>
  <span class="strip-label">近 30 天</span>
</div>
<div class="spark" id="spark"></div>

<div class="src-line" id="src-line" style="display:none"></div>

<div class="card" id="quota-card" style="display:none">
  <div class="card-title">额度</div>
  <div class="quota-model" id="quota-model" style="display:none"></div>
  <div class="quota-rows" id="quota-rows"></div>
</div>

<div class="card tight">
  <div class="clients">
    <div class="client-row">
      <span class="name">国内</span>
      <span class="pid" id="cn-pid"></span>
      <span class="st off" id="cn-st">检测中</span>
    </div>
    <div class="client-row">
      <span class="name">国际</span>
      <span class="pid" id="intl-pid"></span>
      <span class="st off" id="intl-st">检测中</span>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">操作</div>
  <div class="actions">
    <button class="primary" id="btn-inject">
      注入免费模型
      <span class="sub">→ 国内端</span>
    </button>
    <button id="btn-inject-back">
      反向注入
      <span class="sub">→ 国际端</span>
    </button>
    <button id="btn-both">
      智能双开
      <span class="sub">未开则启动</span>
    </button>
    <button id="btn-restart">
      重启客户端
      <span class="sub">让注入生效</span>
    </button>
  </div>
</div>

<div class="card">
  <div class="card-title">最近请求</div>
  <div class="recent" id="recent-list">
    <div class="recent-empty">加载中…</div>
  </div>
</div>

<details class="card">
  <summary class="card-title">本机端点（点击展开复制）</summary>
  <div class="ep-label">OpenAI 兼容 Base URL</div>
  <div class="endpoint">
    <code id="ep-openai"></code>
    <button data-copy="ep-openai">复制</button>
  </div>
  <div class="ep-label">免费联网搜索（Anthropic 协议）</div>
  <div class="endpoint">
    <code id="ep-search"></code>
    <button data-copy="ep-search">复制</button>
  </div>
</details>

<div class="foot">本机回环免密调用 · 完整功能请打开完整面板</div>

<script>
(function () {
  var TOKEN = new URLSearchParams(location.search).get("t") || "";
  document.getElementById("full-link").href = "/?t=" + encodeURIComponent(TOKEN);

  document.getElementById("ep-openai").textContent = location.origin + "/v1";
  document.getElementById("ep-search").textContent = location.origin + "/v1/search/messages";

  function toast(msg, bad) {
    var t = document.createElement("div");
    t.className = "toast" + (bad ? " bad" : "");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, bad ? 6000 : 3200);
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "X-Wbmux-Token": TOKEN }, opts.headers || {});
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return { error: "响应无法解析" }; }).then(function (data) {
        if (!res.ok) throw new Error(data && data.error ? data.error : "HTTP " + res.status);
        return data;
      });
    });
  }
  function post(path, body) {
    return api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
  }

  function setClient(side, stat) {
    var st = document.getElementById(side + "-st");
    var pid = document.getElementById(side + "-pid");
    if (stat && stat.running) {
      st.className = "st on";
      st.textContent = "运行中";
      pid.textContent = (stat.pids && stat.pids.length) ? "PID " + stat.pids[0] : "";
    } else {
      st.className = "st off";
      st.textContent = "未运行";
      pid.textContent = "";
    }
  }
  function refreshStatus() {
    api("/api/clients/status").then(function (res) {
      var c = (res && res.clients) || {};
      setClient("cn", c.cn);
      setClient("intl", c.intl);
    }).catch(function () {});
  }

  // ---------- 轮询节流 ----------
  // 客户端状态是分钟级变化的数据，15 秒一轮足够；弹层藏起来（display:none
  // 的 iframe 在后台标签页里）时两路轮询都停掉，切回来立刻拉一次。
  // stats 失败时退避 5s → 15s → 30s，成功即复位到 5s。
  var statsTimer = null, clientsTimer = null, statsFails = 0;
  var statsBackoff = [5000, 15000, 30000];
  function scheduleStats(delay) {
    clearTimeout(statsTimer);
    statsTimer = setTimeout(function () { loadStats(); }, delay);
  }
  function startPolling() {
    refreshStatus();
    clearInterval(clientsTimer);
    clientsTimer = setInterval(refreshStatus, 15000);
    loadStats();
  }
  function stopPolling() {
    clearTimeout(statsTimer);
    clearInterval(clientsTimer);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopPolling(); else startPolling();
  });
  startPolling();

  // ---------- 胶囊同款指标 ----------
  // 五个指标都来自 /api/embed/stats（请求级快照）：上次请求、生成速率、今日用量。
  // 上次请求超过 256000 转黄、512000 转红——1M 上下文的模型很容易悄悄吃满。
  // 阈值与 stale 分档的唯一口径在 Go 端 internal/embedstats，这里的数字
  // 由 internal/webui 的 TestEmbedHTMLThresholds 锁死一致，别手改一边。
  var CTX_WARN = 256000, CTX_BAD = 512000;
  var STALE_AGED_SEC = 1800, STALE_IDLE_SEC = 7200; // 30 分钟变旧值，120 分钟才算空闲
  function compact(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(2) + "M";
    if (n >= 10000) return Math.round(n / 1000) + "k";
    if (n >= 1000) return (n / 1000).toFixed(1) + "k";
    return String(n);
  }
  function sourceLabel(source, side) {
    if (source === "local") {
      if (side === "cn") return "国内直连";
      if (side === "intl") return "国际直连";
      return "直连";
    }
    return "网关";
  }
  function setSrcLine(last) {
    var line = document.getElementById("src-line");
    if (!last || !last.model) { line.style.display = "none"; line.textContent = ""; return; }
    line.style.display = "";
    line.textContent = "当前数字来自：" + sourceLabel(last.source, last.side) + " · " + last.model;
  }
  function setStaleMark(aged) {
    var pill = document.getElementById("live");
    if (aged) {
      pill.classList.add("stale");
      pill.textContent = "数据过期";
    } else {
      pill.classList.remove("stale");
      pill.textContent = "本机代理在线";
    }
  }
  function loadStats() {
    return api("/api/embed/stats").then(function (s) {
      statsFails = 0;
      setStaleMark(false);
      var last = (s && s.last) || {};
      // 新鲜度三档（与 Go 端 internal/embedstats 一致，前端用 ageSec 兜底）：
      // 30 分钟内正常显示；30–120 分钟显示旧值 + 多久前、不着色；
      // 超过 120 分钟才显示"空闲"。旧数据直接抹掉会丢信息，当"现在"又会误导人。
      var freshness = last.freshness
        || ((last.ageSec || 0) > STALE_IDLE_SEC ? "idle"
          : ((last.ageSec || 0) > STALE_AGED_SEC ? "aged" : "fresh"));
      var idle = freshness === "idle";
      var aged = freshness === "aged";
      var ctx = document.getElementById("m-ctx");
      ctx.textContent = idle ? "空闲" : (last.promptTokens ? compact(last.promptTokens) : "—");
      ctx.className = "hero-num" + (!idle && !aged && last.promptTokens >= CTX_BAD ? " bad" : (!idle && !aged && last.promptTokens >= CTX_WARN ? " warn" : ""));
      document.getElementById("m-rate").textContent = idle ? "—"
        : (last.tokPerSec ? Math.round(last.tokPerSec) + "/s"
          : (last.ttftMs ? "首字 " + (last.ttftMs / 1000).toFixed(1) + "s" : "—"));
      var today = (s && s.today) || {};
      document.getElementById("m-today").textContent = today.tokens ? compact(today.tokens) : "—";
      var totals = (s && s.totals) || {};
      document.getElementById("m-month").textContent = totals.month ? compact(totals.month) : "—";
      document.getElementById("m-total").textContent = totals.total ? compact(totals.total) : "—";
      renderSpark(s && s.daily);
      var line = document.getElementById("src-line");
      if (aged) {
        line.style.display = "";
        line.innerHTML = "";
        var span = document.createElement("span");
        span.className = "aged";
        span.textContent = "数据为 " + ago(last.ageSec) + "前 · 仅供参考";
        line.appendChild(span);
      } else if (idle) {
        line.style.display = "none";
        line.textContent = "";
      } else {
        setSrcLine(last);
      }
      renderRecent((s && s.recent) || []);
      renderQuota(s && s.quota);
      scheduleStats(5000);
    }).catch(function () {
      // 失败不吞旧数：连续失败 ≥2 次（约 10 秒）就把顶栏药丸标成"数据过期"，
      // 旧数字仍保留在原位，但不再冒充实时数据；恢复成功即清标记。
      statsFails++;
      if (statsFails >= 2) setStaleMark(true);
      scheduleStats(statsBackoff[Math.min(statsFails - 1, statsBackoff.length - 1)]);
    });
  }

  // 多久前：只给粗粒度，精确到分钟对这个用途没意义。
  function ago(sec) {
    if (!sec || sec < 60) return "刚刚";
    if (sec < 3600) return Math.floor(sec / 60) + "m";
    if (sec < 86400) return Math.floor(sec / 3600) + "h";
    return Math.floor(sec / 86400) + "d";
  }

  // 近 30 天用量柱子：按当期最大值归一化。没有记录的日子也留 2px 底，
  // 避免"那天没用"和"没有数据"在图上看起来一样。
  function renderSpark(days) {
    var el = document.getElementById("spark");
    el.textContent = "";
    if (!days || !days.length) return;
    var max = 0;
    days.forEach(function (d) { if (d.tokens > max) max = d.tokens; });
    days.forEach(function (d) {
      var bar = document.createElement("i");
      bar.style.height = (max > 0 ? Math.max(2, Math.round((d.tokens / max) * 24)) : 2) + "px";
      if (d.tokens > 0) bar.className = "on";
      bar.title = d.date + " · " + compact(d.tokens);
      el.appendChild(bar);
    });
  }

  function renderRecent(rows) {
    var list = document.getElementById("recent-list");
    list.textContent = "";
    if (!rows.length) {
      var empty = document.createElement("div");
      empty.className = "recent-empty";
      empty.textContent = "还没有经过本机网关的请求";
      list.appendChild(empty);
      return;
    }
    rows.slice(0, 5).forEach(function (r) {
      var row = document.createElement("div");
      row.className = "recent-row";

      var dot = document.createElement("span");
      dot.className = "r-dot" + (r.ok ? "" : " bad");

      var name = document.createElement("span");
      name.className = "r-model";
      name.textContent = r.model || "未知模型";
      name.title = r.model || "";

      var meta = document.createElement("span");
      meta.className = "r-meta";
      var bits = [];
      if (r.promptTokens) bits.push(compact(r.promptTokens));
      if (r.tokPerSec) bits.push(Math.round(r.tokPerSec) + "/s");
      // 行尾标来源：网关 / 国内直连 / 国际直连（Go 端 source/side 字段）。
      if (r.source) bits.push(sourceLabel(r.source, r.side));
      bits.push(ago(r.ageSec));
      meta.textContent = bits.join(" · ");

      row.appendChild(dot);
      row.appendChild(name);
      row.appendChild(meta);
      list.appendChild(row);
    });
  }
  // 额度：当前模型的限流态 + 两档主包余量（/api/embed/stats 的 quota 段）。
  // 没数据的档位后端直接省略，前端不渲染，绝不显示 0%——"没数据"和
  // "用完了"是两回事。周期文案是后端原样带过来的 ExpiryRuleZh /
  // CycleEndTime，这里只照抄，不自己编。
  function quotaTime(q) {
    if (!q) return "";
    if (q.untilMs) {
      var d = new Date(q.untilMs);
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }
    var m = /(\d{2}):(\d{2}):\d{2}/.exec(q.untilText || "");
    return m ? m[1] + ":" + m[2] : "";
  }
  function renderQuota(quota) {
    var card = document.getElementById("quota-card");
    var rows = document.getElementById("quota-rows");
    var modelLine = document.getElementById("quota-model");
    var pkgs = (quota && quota.packages) || [];
    var model = quota && quota.model;
    if (!pkgs.length && !model) {
      card.style.display = "none";
      rows.textContent = "";
      modelLine.style.display = "none";
      modelLine.textContent = "";
      return;
    }
    card.style.display = "";
    if (model && (model.state === "rate_limited" || model.state === "exhausted")) {
      modelLine.style.display = "";
      modelLine.className = "quota-model " + (model.state === "exhausted" ? "bad" : "warn");
      var t = quotaTime(model);
      modelLine.textContent = model.state === "exhausted"
        ? model.model + " 额度用尽"
        : model.model + " 限流" + (t ? "，" + t + " 恢复" : "");
    } else {
      modelLine.style.display = "none";
      modelLine.textContent = "";
    }
    rows.textContent = "";
    pkgs.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "quota-row";

      var side = document.createElement("span");
      side.className = "q-side";
      side.textContent = p.side === "intl" ? "国际包" : "国内包";

      var bar = document.createElement("span");
      bar.className = "q-bar";
      var fill = document.createElement("span");
      fill.className = "q-fill" + (p.percent < 20 ? " warn" : "");
      fill.style.width = Math.max(0, Math.min(100, p.percent)) + "%";
      bar.appendChild(fill);

      var text = document.createElement("span");
      text.className = "q-text";
      // 有到期信息就显示天数："X 天后重置"（普通色）；一周内清零且还有
      // 余额，换成"X 天后清零"并转琥珀色。余额为 0 也显示天数——用户
      // 需要知道什么时候能重新有额度，但不再强调（已经用尽）。
      var tail = "";
      if (p.daysLeft > 0) {
        var hot = p.expiring && p.percent > 0;
        tail = hot ? " · " + p.daysLeft + " 天后清零" : " · " + p.daysLeft + " 天后重置";
        if (hot) row.className = "quota-row expiring";
      } else if (p.cycleText) {
        tail = " · " + p.cycleText;
      }
      text.textContent = "剩余 " + p.percent.toFixed(1) + "%" + tail;

      row.appendChild(side);
      row.appendChild(bar);
      row.appendChild(text);
      rows.appendChild(row);
    });
  }

  function bind(id, fn) {
    var btn = document.getElementById(id);
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      btn.disabled = true;
      var done = function () { btn.disabled = false; };
      fn(done, btn);
    });
  }

  bind("btn-inject", function (done) {
    post("/api/inject-custom-models").then(function (res) {
      toast((res.note || "注入完成") + "（新增 " + (res.added || 0) + " 个），重启国内端后生效");
      done();
    }).catch(function (e) { toast("注入失败：" + e.message, true); done(); });
  });

  bind("btn-inject-back", function (done) {
    post("/api/inject-cn-into-intl").then(function (res) {
      toast((res.note || "反向注入完成") + "（共 " + (res.added || 0) + " 个）");
      done();
    }).catch(function (e) { toast("反向注入失败：" + e.message, true); done(); });
  });

  bind("btn-both", function (done) {
    post("/api/launch-both").then(function (res) {
      var parts = (res.results || []).map(function (r) {
        var name = r.side === "cn" ? "国内" : "国际";
        if (r.alreadyRunning) return name + "已在跑";
        return name + (r.ok ? "已启动" : "失败:" + (r.err || "?"));
      });
      toast(parts.join("；") || "双开完成");
      refreshStatus();
      done();
    }).catch(function (e) { toast("双开失败：" + e.message, true); done(); });
  });

  bind("btn-restart", function (done) {
    if (!confirm("会先关闭再重启国内客户端。\n当前对话与未保存内容可能中断，继续吗？")) { done(); return; }
    post("/api/restart-client", { target: "cn", native: true }).then(function (pv) {
      toast("已重启国内客户端" + (pv.killed ? "（关闭旧进程 " + pv.killed + " 个）" : ""));
      refreshStatus();
      done();
    }).catch(function (e) { toast("重启失败：" + e.message, true); done(); });
  });

  document.querySelectorAll("[data-copy]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var text = document.getElementById(btn.getAttribute("data-copy")).textContent;
      function ok() { toast("已复制：" + text); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, function () { fallback(); });
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); ok(); } catch (e) { toast("复制失败，请手动选择", true); }
        ta.remove();
      }
    });
  });
})();
</script>
</body>
</html>
