<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wbmux · 会话中心</title>
<style>
  /* 配色与 index.html 同源：石墨灰低饱和，彩色只留给有含义的地方。 */
  :root {
    --g0: #0b0c0e; --g1: #131417; --g2: #191b1f; --g3: #212328;
    --g4: #2c2f35; --g5: #3a3e46;
    --ink: #e8eaed; --ink-2: #a8adb7; --ink-3: #71767f;
    --ok: #4a9d6a; --warn: #b8863b; --bad: #c25550; --info: #5b8dd6;
    --brand: #63b3c4;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  /* body 是纵向 flex，顶部这些条都不该被压扁——它们不是"剩余空间"，是固定高度的。 */
  header, .warnbar, #cleanbar, #expbar, .hint { flex: none; }
  /* 页面本体不滚：滚动发生在上下两块**内部**。这样项目列表再长
     也顶不动下面的会话表格（原来左右布局时就是这么被顶走的）。 */
  body { margin: 0; background: var(--g0); color: var(--ink);
         font: 13.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 14px 18px 10px; border-bottom: 1px solid var(--g4);
           display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
           flex: none; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header .sub { color: var(--ink-3); font-size: 12px; }
  header input, header select {
    background: var(--g3); color: var(--ink); border: 1px solid var(--g4);
    border-radius: 6px; padding: 4px 8px; font-size: 12.5px; }
  header input[type=number] { width: 62px; }
  header button {
    background: var(--g3); color: var(--ink); border: 1px solid var(--g5);
    border-radius: 6px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; }
  header button:hover { background: var(--g4); }
  header button:disabled { opacity: .5; cursor: wait; }
  /* 警告条固定**一行**（可点开看全部）。
     原来多条警告就是多行，而布局是"页面不滚、滚动在内部"——
     警告一多就把项目列表和会话表格往下挤。 */
  .warnbar { margin: 8px 18px 0; padding: 6px 12px; border-radius: 8px;
             background: var(--g2); border: 1px solid var(--g5);
             color: var(--warn); font-size: 12.5px; cursor: pointer;
             display: flex; align-items: center; gap: 8px; }
  .warnbar .cnt { flex: none; font-weight: 600; }
  .warnbar .first { flex: 1; min-width: 0; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  .warnbar .more { flex: none; font-size: 11.5px; opacity: .8; }
  .warnbar .all { display: none; margin-top: 6px; padding-top: 6px;
                  border-top: 1px solid var(--g5); white-space: pre-line; }
  .warnbar.open { cursor: default; }
  .warnbar.open .all { display: block; }
  /* 清理面板：这是全页唯一会动文件的地方，所以做得比别处"重"——
     有边框、有标题、按钮分两步，避免误点。 */
  #cleanbar { margin: 10px 18px 0; padding: 12px 14px; border-radius: 8px;
              background: var(--g1); border: 1px solid var(--g5); font-size: 12.5px; }
  #cleanbar h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  #cleanbar .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  #cleanbar button { background: var(--g3); color: var(--ink);
                     border: 1px solid var(--g5); border-radius: 6px;
                     padding: 5px 14px; font-size: 12.5px; cursor: pointer; }
  #cleanbar button:hover { background: var(--g4); }
  #cleanbar button:disabled { opacity: .5; cursor: not-allowed; }
  #cleanbar button.danger { border-color: var(--bad); color: var(--bad); }
  #cleanbar button.danger:hover { background: var(--g3); }
  #cleanbar .list { max-height: 220px; overflow: auto; margin: 8px 0 0;
                    padding: 8px 10px; background: var(--g2); border-radius: 6px; }
  #cleanbar .list div { padding: 1px 0; font-family: var(--mono); font-size: 11.5px;
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cleanbar .ok { color: var(--ok); }
  #cleanbar .bad { color: var(--bad); }
  #cleanbar .warn { color: var(--warn); }
  /* 行内的"导出"小按钮。比表格字小一号，不抢注意力。 */
  button.mini { background: var(--g3); color: var(--ink-2); border: 1px solid var(--g5);
                border-radius: 5px; padding: 2px 9px; font-size: 11.5px; cursor: pointer; }
  button.mini:hover { background: var(--g4); color: var(--ink); }
  button.mini.open { color: var(--brand); border-color: var(--brand); }
  button.mini.open:hover { background: var(--g4); }
  button.mini + button.mini { margin-left: 5px; }
  button.mini:disabled { opacity: .5; cursor: wait; }
  .nope { color: var(--ink-3); font-size: 11.5px; }
  #expbar { margin-top: 12px; padding: 10px 12px; border-radius: 7px;
            background: var(--g1); border: 1px solid var(--g5); font-size: 12.5px; }
  #expbar .row { display: flex; gap: 8px; margin-top: 9px; }
  #expbar button { background: var(--g3); color: var(--ink); border: 1px solid var(--g5);
                   border-radius: 6px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; }
  #expbar button:hover { background: var(--g4); }
  #expbar .ok { color: var(--ok); }
  #expbar .bad { color: var(--bad); }

  /* 加载态的小转圈。之前只有 index.html 里有，这里补一份。 */
  .spinner { display: inline-block; width: 10px; height: 10px; margin-right: 6px;
             border: 2px solid var(--g5); border-top-color: var(--brand);
             border-radius: 50%; animation: spin .7s linear infinite;
             vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 上下布局：项目列表在上（横向滚），会话表格在下（占满宽度）。
     原来左右两栏时，45 个项目把页面撑到 2700px 高，右边的会话表格被顶走
     ——滚下去全是空白的左栏。换成上下之后，两边各自占一块固定高度、
     各自内部滚动，谁也撑不动谁。 */
  /* 高度用 flex 撑满剩余空间（body 是纵向 flex），而不是
     calc(100vh - 某个写死的数)。header 的高度会因为展开清理面板、
     导出结果条而变化 —— 写死就会在某些状态下算错。 */
  main { display: flex; flex-direction: column; gap: 12px;
         padding: 0 18px 18px; flex: 1; min-height: 0; }
  /* 上：项目列表（横向一条，可左右滚） */
  #projects { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
              padding-bottom: 4px; flex: none; }
  #projects::-webkit-scrollbar { height: 8px; }
  .proj { padding: 7px 11px; border-radius: 8px; background: var(--g1);
          border: 1px solid transparent; cursor: pointer; flex: none;
          max-width: 320px; }
  .proj:hover { background: var(--g2); }
  .proj.sel { border-color: var(--brand); background: var(--g2); }
  .proj .name { font-weight: 600; font-size: 12.5px; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  .proj .meta { color: var(--ink-3); font-size: 11px; margin-top: 1px;
                display: flex; gap: 8px; white-space: nowrap; }
  .proj .stale { color: var(--warn); }
  /* 下：会话明细（占满宽度，自己滚） */
  #detail { flex: 1; min-height: 0; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--ink-3); font-weight: 500;
       padding: 4px 8px; border-bottom: 1px solid var(--g4); white-space: nowrap; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--g3); vertical-align: top; }
  tr.cand td { background: rgba(194, 85, 80, .07); }
  td.title { word-break: break-all; }
  td.path { font-family: var(--mono); color: var(--ink-3); font-size: 11px; word-break: break-all; }
  .vb { display: inline-block; padding: 0 7px; border-radius: 9px;
        font-size: 11px; border: 1px solid var(--g5); color: var(--ink-2); white-space: nowrap; }
  .vb.wb-cn   { color: #7fb069; border-color: #3c5233; }
  .vb.wb-intl { color: #5b8dd6; border-color: #2f4a6e; }
  .vb.zcode   { color: #63b3c4; border-color: #2e525a; }
  .vb.codex   { color: #b8863b; border-color: #5a451f; }
  .vb.claude  { color: #c2885a; border-color: #5a3f2a; }
  .candmark { color: var(--bad); font-weight: 600; }
  .archived { color: var(--ink-3); }
  /* 空状态提示：用 **class** 不用 id。
     它会被 innerHTML 反复重建（"没有匹配的项目" / "选一个项目" /
     "该项目没有匹配的会话" 三处共用），复用同一个 id 会诱使别处
     去 getElementById 它——而那个节点运行时可能并不存在，
     2026-10-01 的"重新扫描无响应"就是这么来的。 */
  .empty { color: var(--ink-3); padding: 30px; text-align: center; }
  .hint { color: var(--ink-3); font-size: 12px; padding: 0 18px; }
</style>
</head>
<body>
<header>
  <h1>会话中心</h1>
  <span class="sub" id="gen">未扫描</span>
  <input type="search" id="q" placeholder="搜项目 / 标题…" style="width:220px">
  <label class="sub">保留 <input type="number" id="days" value="30" min="1"> 天</label>
  <label class="sub">项目保底 <input type="number" id="keep" value="1" min="1"> 条</label>
  <select id="vendor"><option value="">全部来源</option></select>
  <label class="sub"><input type="checkbox" id="onlyCand"> 只看清理候选</label>
  <button id="refresh">重新扫描</button>
  <button id="reload">套用参数</button>
  <button id="clean">清理候选…</button>
</header>
<div class="hint">
  候选 = 超过保留期 <b>且</b> 在项目内名次高于保底值——每个项目永远至少留最新几条，
  不会清到零。列表本身不删任何东西；要清点右边的按钮，它会先给你看清单。
</div>
<div class="warnbar" id="warn" style="display:none"></div>
<div id="cleanbar" style="display:none"></div>
<main>
  <div id="projects"></div>
  <div id="detail"><div class="empty">加载中…</div></div>
</main>
<script>
"use strict";
// 令牌跟首页同一模型：在 ?t= 里带着，API 调用原样回传。
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var API = "/api/sessions?t=" + encodeURIComponent(TOKEN);

var state = { idx: null, sel: null };

// 生命周期事件流：服务端退出（Ctrl+C / 进程被杀）时连接立刻断，app 窗口
// 自关；普通标签页退回"服务已退出"提示。onerror 不立刻认定退出——
// EventSource 按 retry:2000 自动重连，3.5 秒内连回来就当没事发生。
var byeOnce = false;
var esRetry = null;
function bye() {
  if (byeOnce) return;
  byeOnce = true;
  document.body.innerHTML =
    '<div style="padding:40px;text-align:center;color:var(--ink-3)">' +
    '会话中心服务已退出。重新运行 <code>wbmux sessions --web</code> 即可恢复，地址与令牌不变。</div>';
  setTimeout(function () { window.close(); }, 400);
}
try {
  var es = new EventSource("/api/events?t=" + encodeURIComponent(TOKEN));
  es.addEventListener("bye", bye);
  es.onopen = function () {
    if (esRetry) { clearTimeout(esRetry); esRetry = null; }
  };
  es.onerror = function () {
    if (byeOnce || esRetry) return;
    esRetry = setTimeout(function () { esRetry = null; bye(); }, 3500);
  };
} catch (e) { /* EventSource 不可用就走原有的加载失败提示 */ }

function fetchJSON(url, opts) {
  return fetch(url, opts).then(function (res) {
    return res.json().then(function (body) {
      if (!res.ok) throw new Error(body.error || res.statusText);
      return body;
    });
  });
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtMs(ms) {
  if (!ms) return "—";
  var d = new Date(ms);
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
         " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function fmtBytes(n) {
  if (!n) return "—";
  if (n >= 1 << 30) return (n / (1 << 30)).toFixed(1) + "G";
  if (n >= 1 << 20) return Math.round(n / (1 << 20)) + "M";
  if (n >= 1 << 10) return Math.round(n / (1 << 10)) + "K";
  return n + "B";
}

function load(refresh) {
  var btn = document.getElementById(refresh ? "refresh" : "reload");
  btn.disabled = true;

  // 状态写在 #gen 上，**不能写 #empty**。
  //
  // #empty 不是固定元素：renderProjects / renderDetail 每次都用 innerHTML
  // 重建它（"没有匹配的项目" / "选一个项目" / "加载中…" 三种文案共用这一个 id）。
  // 扫过一次之后它就不存在了，`getElementById("empty").textContent = …`
  // 会抛 TypeError —— 而那一行在 fetch **之前**，于是：
  //   ① 请求根本发不出去；② 后面的 .finally 也没挂上，按钮永久禁用。
  // 表现就是"点了重新扫描，一直转、永远不回来"。2026-10-01 实测复现。
  var gen = document.getElementById("gen");
  if (gen) gen.textContent = refresh ? "扫描中…" : "加载中…";

  var url = API + "&days=" + document.getElementById("days").value +
            "&keep=" + document.getElementById("keep").value + (refresh ? "&refresh=1" : "");
  fetchJSON(url).then(render).catch(function (e) {
    if (gen) gen.textContent = "加载失败：" + e.message;
  }).finally(function () { btn.disabled = false; });
}

function render(idx) {
  state.idx = idx;
  document.getElementById("gen").textContent =
    "扫描于 " + fmtMs(idx.generatedAt) + (idx.cached ? "（缓存）" : "") +
    " · 共 " + idx.sessions.length + " 条会话 / " + idx.projects.length + " 个项目";
  var warn = document.getElementById("warn");
  if (idx.warnings && idx.warnings.length) {
    var ws = idx.warnings;
    warn.style.display = "";
    // 一条时直接显示；多条时压成一行、点开看全部。
    warn.className = "warnbar" + (ws.length > 1 ? " openable" : "");
    warn.innerHTML =
      (ws.length > 1 ? '<span class="cnt">' + ws.length + " 条提示</span>" : "") +
      '<span class="first">' + esc(ws[0]) + "</span>" +
      (ws.length > 1
        ? '<span class="more">点开看全部 ▾</span>' +
          '<div class="all">' + ws.map(esc).join("\n") + "</div>"
        : "");
    if (ws.length > 1) {
      warn.onclick = function () {
        var open = warn.classList.contains("open");
        warn.classList.toggle("open", !open);
        var m = warn.querySelector(".more");
        if (m) m.textContent = open ? "点开看全部 ▾" : "收起 ▴";
      };
    }
  } else { warn.style.display = "none"; }

  // 来源下拉（按实际扫到的来源动态生成）
  var vendors = {};
  idx.sessions.forEach(function (s) { vendors[s.vendor] = true; });
  var sel = document.getElementById("vendor");
  var cur = sel.value;
  sel.innerHTML = '<option value="">全部来源</option>' + Object.keys(vendors).sort().map(function (v) {
    return '<option value="' + esc(v) + '">' + esc(v) + "</option>";
  }).join("");
  if (vendors[cur]) sel.value = cur;

  renderProjects();
  renderDetail();
}

function passFilters(p, sessions) {
  var q = document.getElementById("q").value.trim().toLowerCase();
  var v = document.getElementById("vendor").value;
  var onlyCand = document.getElementById("onlyCand").checked;
  if (q && p.display.toLowerCase().indexOf(q) < 0 &&
      !sessions.some(function (s) { return s.title.toLowerCase().indexOf(q) >= 0; })) return false;
  if (v && !p.vendors[v]) return false;
  if (onlyCand && !sessions.some(function (s) { return s.candidate; })) return false;
  return true;
}

function renderProjects() {
  var box = document.getElementById("projects");
  var all = state.idx.sessions;
  var shown = 0;
  var html = state.idx.projects.map(function (p) {
    var ss = all.filter(function (s) { return s.project === p.path; });
    if (!passFilters(p, ss)) return "";
    shown++;
    if (!state.sel) state.sel = p.path;
    var badges = Object.keys(p.vendors).sort().map(function (v) {
      return '<span class="vb ' + esc(v) + '">' + esc(v) + "×" + p.vendors[v] + "</span>";
    }).join(" ");
    return '<div class="proj' + (state.sel === p.path ? " sel" : "") + '" data-p="' + esc(p.path) + '">' +
      '<div class="name">' + esc(p.display) + "</div>" +
      '<div class="meta">' + badges +
      "<span>最近 " + fmtMs(p.lastMs) + "</span>" +
      "<span>" + p.count + " 条</span>" +
      (p.totalBytes ? "<span>" + fmtBytes(p.totalBytes) + "</span>" : "") +
      (p.onlyStale ? '<span class="stale">⚠ 全部超期（保底 ' + state.idx.keepPerProject + " 条仍在）</span>" : "") +
      "</div></div>";
  }).join("");
  box.innerHTML = html || '<div class="empty">没有匹配的项目</div>';
  Array.prototype.forEach.call(box.querySelectorAll(".proj"), function (el) {
    el.onclick = function () { state.sel = el.getAttribute("data-p"); renderProjects(); renderDetail(); };
  });
}

function renderDetail() {
  var box = document.getElementById("detail");
  var ss = state.idx.sessions.filter(function (s) { return s.project === state.sel; });
  var v = document.getElementById("vendor").value;
  var q = document.getElementById("q").value.trim().toLowerCase();
  var onlyCand = document.getElementById("onlyCand").checked;
  var rows = ss.filter(function (s) {
    if (v && s.vendor !== v) return false;
    if (onlyCand && !s.candidate) return false;
    if (q && s.title.toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  if (!state.sel) { box.innerHTML = '<div class="empty">← 选一个项目</div>'; return; }
  box.innerHTML = "<table><thead><tr>" +
    "<th>来源</th><th>标题</th><th>更新</th><th>大小</th><th>类别</th><th>候选</th><th>位置</th><th></th>" +
    "</tr></thead><tbody>" + rows.map(function (s, i) {
      // 只有能导出的源给按钮。不能导的给一句说明，而不是一个点了报错的按钮。
      // "能不能看"与"能不能导出"现在是同一批源，但判断分开写：
      // 以后 Claude 可能先能看、还不能导。
      var canView = s.vendor === "codex";
      var canExp = s.vendor === "codex";
      var act = "";
      if (canView) {
        act += '<button class="mini open" data-i="' + i + '">打开</button>';
      }
      if (canExp) {
        act += '<button class="mini" data-i="' + i + '">导出</button>';
      }
      if (!canView && !canExp) {
        act = '<span class="nope" title="这个源的正文不在独立文件里，暂不支持直接查看">—</span>';
      }
      return "<tr" + (s.candidate ? ' class="cand"' : "") + ">" +
        '<td><span class="vb ' + esc(s.vendor) + '">' + esc(s.vendor) + "</span></td>" +
        '<td class="title">' + esc(s.title) + (s.archived ? ' <span class="archived">（已归档）</span>' : "") + "</td>" +
        "<td>" + fmtMs(s.updatedMs) + "</td>" +
        "<td>" + fmtBytes(s.sizeBytes) + "</td>" +
        "<td>" + esc(s.kind || "") + "</td>" +
        "<td>" + (s.candidate ? '<span class="candmark">候选 #' + s.rank + "</span>" : "#" + s.rank) + "</td>" +
        '<td class="path">' + esc(s.source.path) + "</td>" +
        "<td>" + act + "</td></tr>";
    }).join("") + "</tbody></table>" +
    (rows.length ? "" : '<div class="empty">该项目没有匹配的会话</div>') +
    '<div id="expbar" style="display:none"></div>';

  // 记下当前表格里"能导出"的 id，供"导出整个项目"用。
  window.__expIds = rows.filter(function (s) { return s.vendor === "codex"; })
                       .map(function (s) { return s.id; });

  // 绑"导出"。用 data-i 回指 rows 里的下标，避免把 id 拼进 HTML 属性
  // ——会话标题里可能有引号，拼进去会把属性截断。
  Array.prototype.forEach.call(box.querySelectorAll("button.mini.open"), function (b) {
    b.onclick = function () { openSession(rows[Number(b.getAttribute("data-i"))]); };
  });
  Array.prototype.forEach.call(box.querySelectorAll("button.mini:not(.open)"), function (b) {
    b.onclick = function () { doExport(rows[Number(b.getAttribute("data-i"))], b); };
  });
}

// openSession 在新标签页里打开这个会话。
//
// 用 window.open 而不是在当前页替换：用户多半想"看完就关掉回到列表"，
// 而且新标签页可以是全屏宽度，比右侧那块窄栏舒服得多。
function openSession(s) {
  var u = "/session?id=" + encodeURIComponent(s.id) +
          "&t=" + encodeURIComponent(TOKEN) +
          "&title=" + encodeURIComponent(s.title || "");
  window.open(u, "_blank", "noopener");
}

// doExport 导出单个会话。
//
// **只读操作**，所以不做"两步确认"——它不改用户任何东西，最坏结果是多出
// 一个 HTML 文件。但要让用户知道存哪了，否则导完找不着。
function doExport(s, btn) {
  var bar = document.getElementById("expbar");
  if (!bar) return;
  btn.disabled = true;
  bar.style.display = "";
  bar.innerHTML = "<span class='spinner'></span> 正在导出「" + esc((s.title || "").slice(0, 30)) + "」…";

  fetchJSON("/api/sessions/export?t=" + encodeURIComponent(TOKEN) +
            "&days=" + document.getElementById("days").value +
            "&keep=" + document.getElementById("keep").value, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: s.id })
  }).then(function (v) {
    var lines = [];
    if (v.exported > 0) {
      lines.push("<span class='ok'>已导出</span> → " + esc(v.index || v.dir));
      lines.push("<div class='hint' style='padding:4px 0 0'>双击那个 index.html 就能在浏览器里看，" +
                 "图片是内嵌的，不用另外找。</div>");
    } else {
      lines.push("<span class='warn'>没导出任何东西</span>");
      (v.failed || []).forEach(function (f) { lines.push("<div class='bad'>" + esc(f) + "</div>"); });
      (v.skipped || []).forEach(function (f) { lines.push("<div class='warn'>" + esc(f) + "</div>"); });
      if (!v.failed || !v.failed.length) {
        lines.push("<div class='hint' style='padding:0'>这个源暂不支持导出：它的正文不在独立文件里。</div>");
      }
    }
    lines.push("<div class='row'><button id='exp-close'>知道了</button>");
    lines.push("<button id='exp-open'>导出整个项目</button></div>");
    bar.innerHTML = lines.join("");
    document.getElementById("exp-close").onclick = function () { bar.style.display = "none"; };
    document.getElementById("exp-open").onclick = function () { doExportProject(); };
  }).catch(function (e) {
    bar.innerHTML = "<span class='bad'>导出失败：" + esc(e.message) + "</span>";
  }).finally(function () { btn.disabled = false; });
}

// doExportProject 导出当前选中的整个项目。
//
// 不给"导出全部"按钮：63 个会话 256 MB，一次点下去要等半天且没说清导到哪。
// 用户在某个项目上想"这本都带走"，够用了。
function doExportProject() {
  var bar = document.getElementById("expbar");
  var btn = document.getElementById("exp-open");
  if (btn) btn.disabled = true;
  bar.innerHTML = "<span class='spinner'></span> 正在导出整个项目…";
  fetchJSON("/api/sessions/export?t=" + encodeURIComponent(TOKEN) +
            "&days=" + document.getElementById("days").value +
            "&keep=" + document.getElementById("keep").value, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    // 传项目路径里的 id 列表太啰嗦；这里靠后端按项目筛不划算，
    // 所以走"逐个导"——前端把当前表格里的 id 全发过去。
    body: JSON.stringify({ ids: window.__expIds || [] })
  }).then(function (v) {
    bar.innerHTML = "<span class='ok'>已导出 " + (v.exported || 0) + " 个</span> → " +
      esc(v.index || v.dir) + "<div class='row'><button id='exp-close2'>知道了</button></div>";
    document.getElementById("exp-close2").onclick = function () { bar.style.display = "none"; };
  }).catch(function (e) {
    bar.innerHTML = "<span class='bad'>导出失败：" + esc(e.message) + "</span>";
  });
}

document.getElementById("refresh").onclick = function () { load(true); };
document.getElementById("reload").onclick = function () { load(false); };

// ---------- 清理候选 ----------
//
// 这是全页唯一会动文件的地方，所以走**两步**：
//   ① 点「清理候选…」→ 先请求预演，把清单摆出来（不删任何东西）
//   ② 看完清单再点「确认移入回收站」→ 才真执行
//
// 后端也要求 confirm=true **且** dryRun=false 两个字段同时给，
// 一个布尔值太容易被顺手传上去。两边都拦，是为了让"误删"不可能靠一次点击发生。

function cleanParams() {
  return "&days=" + document.getElementById("days").value +
         "&keep=" + document.getElementById("keep").value;
}

function renderCleanPlan(v) {
  var bar = document.getElementById("cleanbar");
  var out = [];
  var n = (v.targets || []).length;
  var mb = (v.totalBytes || 0) / 1048576;

  out.push("<h3>清理候选 · 预演</h3>");
  if (v.result) {
    out.push("<div>检查了 " + n + " 个文件，合计 " + mb.toFixed(0) + " MB。");
    if ((v.result.skipped || []).length) {
      out.push("<span class='warn'>其中 " + v.result.skipped.length + " 个会被跳过</span>");
    }
    out.push("</div>");
  } else {
    out.push("<div>可清理 " + n + " 个文件，合计 " + mb.toFixed(0) + " MB。</div>");
  }
  out.push("<div class='hint' style='padding:6px 0 0'>预演没有动任何文件。</div>");

  if ((v.refused || []).length) {
    out.push("<div style='margin-top:8px'><b>有 " + v.refused.length +
             " 条候选不能按文件清</b>——它们的会话存在数据库里，删文件会连库里别的会话一起没：</div>");
    v.refused.forEach(function (r) {
      out.push("<div class='list' style='display:block'>" + esc(r.reason) +
               "（该位置被 " + r.sharedBy + " 条会话共用）</div>");
    });
  }

  if (n) {
    out.push("<div class='list' id='clean-list'>");
    v.targets.slice(0, 200).forEach(function (t) {
      out.push("<div title='" + esc(t.path) + "'>" +
               (t.size / 1048576).toFixed(1).padStart(7) + " MB  " +
               esc(t.project || "") + "  " + esc(t.title || "") + "</div>");
    });
    out.push("</div>");
    if (n > 200) {
      out.push("<div class='hint' style='padding-left:0'>（只列出前 200 个，实际会清 " + n + " 个）</div>");
    }
  }

  out.push("<div class='row'>");
  if (n) {
    out.push("<button class='danger' id='clean-go'>确认移入回收站</button>");
  }
  out.push("<button id='clean-cancel'>取消</button>");
  out.push("<span id='clean-note' class='hint' style='padding:0'></span>");
  out.push("</div>");

  bar.innerHTML = out.join("");
  bar.style.display = "";

  var cancel = document.getElementById("clean-cancel");
  if (cancel) cancel.onclick = function () { bar.style.display = "none"; };
  var go = document.getElementById("clean-go");
  if (go) go.onclick = function () { doClean(go); };
}

function loadCleanPlan() {
  var btn = document.getElementById("clean");
  btn.disabled = true;
  var bar = document.getElementById("cleanbar");
  bar.style.display = "";
  bar.innerHTML = "<h3>清理候选</h3><div class='hint' style='padding:0'>" +
                  "<span class='spinner'></span> 正在算可清理的清单…</div>";
  fetchJSON("/api/sessions/clean?t=" + encodeURIComponent(TOKEN) + cleanParams())
    .then(renderCleanPlan)
    .catch(function (e) {
      bar.innerHTML = "<h3>清理候选</h3><div class='bad'>算清单失败：" + esc(e.message) + "</div>";
    })
    .finally(function () { btn.disabled = false; });
}

function doClean(btn) {
  var note = document.getElementById("clean-note");
  btn.disabled = true;
  if (note) note.textContent = "正在移入回收站…";
  fetchJSON("/api/sessions/clean?t=" + encodeURIComponent(TOKEN) + cleanParams(), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    // 两个字段都要：后端要求 confirm 为真且 dryRun 明确为假。
    body: JSON.stringify({ confirm: true, dryRun: false })
  }).then(function (v) {
    var r = v.result || {};
    var bar = document.getElementById("cleanbar");
    var lines = ["<h3>清理完成</h3>"];
    lines.push("<div class='ok'>已移入回收站 " + (r.moved || 0) + " 个文件，释放 " +
               ((r.freedBytes || 0) / 1048576).toFixed(0) + " MB。</div>");
    if ((r.failed || []).length) {
      lines.push("<div class='bad'>失败 " + r.failed.length + " 个：</div>");
      r.failed.forEach(function (f) { lines.push("<div class='list' style='display:block'>" + esc(f) + "</div>"); });
    }
    if ((r.skipped || []).length) {
      lines.push("<div class='warn'>跳过 " + r.skipped.length + " 个（多为已不存在）：</div>");
      r.skipped.slice(0, 20).forEach(function (f) { lines.push("<div class='list' style='display:block'>" + esc(f) + "</div>"); });
    }
    lines.push("<div class='hint' style='padding:6px 0 0'>文件在回收站里，需要时可右键还原。</div>");
    lines.push("<div class='row'><button id='clean-close'>知道了</button></div>");
    bar.innerHTML = lines.join("");
    document.getElementById("clean-close").onclick = function () { bar.style.display = "none"; };
    // 索引缓存已被后端丢掉，重新拉一次让列表反映现状。
    load(false);
  }).catch(function (e) {
    if (note) note.textContent = "";
    btn.disabled = false;
    var bar = document.getElementById("cleanbar");
    bar.innerHTML = "<h3>清理失败</h3><div class='bad'>" + esc(e.message) +
                    "</div><div class='row'><button id='clean-close'>知道了</button></div>";
    document.getElementById("clean-close").onclick = function () { bar.style.display = "none"; };
  });
}

document.getElementById("clean").onclick = loadCleanPlan;
["q", "vendor", "onlyCand"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", function () {
    state.sel = null; renderProjects(); renderDetail();
  });
});
load(false);
</script>
