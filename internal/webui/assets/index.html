="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol><symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol></defs></svg>
<div class="app">

    <p class="brand-sub" style="display:flex;gap:6px;align-items:center">

    <p class="brand-sub ver" id="side-msg"

    <nav class="nav">
      <div class="nav-group">

    <div class="sidebar-foot">
      <span class="foot-note" id="settings-note"></span>
      <!-- 启动按钮放在这里而不是页面里：切换页时要先选后端、看完预览才知道能启动，
           而"启动"是这一步的收尾动作。放在侧边栏底部与「关闭界面」同一列，
           是为了这两件事一眼可见——它们都作用在"整个界面"这一层，不属于某一页。 -->
      <button class="primary" id="btn-launch-side" hidden>
        <svg class="ico ico-sm" aria-hidden="true"><use href="#i-play"/></svg>启动客户端
      </button>
      <!-- 重启按钮：改完"要重启才生效"的设置（压缩阈值、后端配置）后，
           用户不必自己去托盘退出再回来点启动。一直显示，因为它本身就是
           一个完整动作，不像"启动"那样需要先选好后端。 -->
      <button class="ghost" id="btn-restart-side">
        <svg class="ico ico-sm" aria-hidden="true"><use href="#i-swap"/></svg>重启客户端
      </button>
      <button class="ghost danger" id="btn-quit"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-x"/></svg>关闭界面</button>
    </div>
  </aside>
  <main class="main">
    <div data-page="status">
      <!-- 1.0 核心主路径引导看板 (Hero Card) -->
      <div class="hero-card">
        <div class="hero-card-head">
          <div class="hero-title">
            <svg class="ico" style="color:var(--brand)" aria-hidden="true"><use href="#i-server"/></svg>
            无缝模式：国际免费大模型快速注入
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="hero-badge" id="telemetry-badge" style="background:rgba(74,157,106,0.18);color:var(--ok);border:1px solid rgba(74,157,106,0.3)" title="后台自适应遥测守护进行中：自动上报活跃心跳与持久化设备指纹，杜绝被服务端风控判定脱机">
              <span class="status-pill status-pill-active" style="width:6px;height:6px;display:inline-block"></span>
              🛡️ 遥测守护在线
            </span>
            <span class="hero-badge">强烈推荐</span>
          </div>
        </div>
        <div class="hero-desc">
          将国际端限时免费的顶级模型（DeepSeek-V4.1-Flash / Step-5-Preview / Hy3 等 0.00x 费率）一键注入国内客户端自定义模型清单。<br>
          国内客户端继续使用小程序远程控制，同时零成本享受国际大模型。注入后点击重启客户端即可生效。
        </div>
        <div class="hero-actions">
          <button class="btn-hero" id="btn-inject" title="把国际限时免费模型注入国内客户端（经本机代理转发、扣国际额度）">
            <svg class="ico ico-sm" aria-hidden="true"><use href="#i-up"/></svg>
            一键注入免费模型到国内端
          </button>
          <button class="ghost" id="btn-inject-cn-intl" title="把国内端专属模型（MiniMax、GLM-5.1、Kimi、DeepSeek 等）反向注入到国际客户端（~/.workbuddy-ai/models.json）">
            <svg class="ico ico-sm" aria-hidden="true"><use href="#i-download"/></svg>
            反向注入国内模型到国际端
          </button>
          <button class="ghost" id="btn-hero-restart" title="重启国内客户端使新注入的模型生效">
            <svg class="ico ico-sm" aria-hidden="true"><use href="#i-reload"/></svg>
            重启客户端生效
          </button>
          <button class="ghost" id="btn-hero-both" title="两侧各用各的安装同时启动（国内管小程序，国际用模型）">
            <svg class="ico ico-sm" aria-hidden="true"><use href="#i-swap"/></svg>
            双开两侧客户端
          </button>
          <button class="ghost" id="btn-probe" title="两侧各发一条最小消息，验证通路与扣费">
            <svg class="ico ico-sm" aria-hidden="true"><use href="#i-play"/></svg>
            一键测试通路
          </button>
          <span class="hint" id="usage-note" style="margin:0"></span>
        </div>
        <div id="probe-body" style="margin-top:10px"></div>
      </div>

  <section id="usage-sec">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="margin:0"><svg class="ico-sm" aria-hidden="true"><use href="#i-gauge"/></svg>额度与计费</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="ghost" id="btn-export-cred" style="padding:4px 10px;font-size:12px;color:var(--accent);border-color:rgba(var(--accent-rgb),0.35)" title="安全导出/备份国际版凭据 (Token / 灾备 JSON 备份)">
          <svg class="ico ico-sm" aria-hidden="true"><use href="#i-down"/></svg> 导出国际版凭据
        </button>
        <button class="ghost" id="btn-usage-scan" style="padding:4px 10px;font-size:12px"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-reload"/></svg>刷新额度</button>
      </div>
    </div>
    <details class="fold" style="margin-bottom:10px">
      <summary>三种用法、怎么分清当前窗口、扣哪个额度</summary>
      <div class="desc" style="margin-top:6px">
        <div>① <b>同时用两个（推荐）</b>：目标后端区块点「双开两侧」——国内客户端管小程序远程控制+国内额度；国际客户端用国际模型+国际额度。想不花钱：国际侧 DeepSeek-V4.1-Flash / Step-5-Preview / Hy3 官方限时免费（0.00x）。</div>
        <div>② <b>切换（宿主壳子连国际）</b>：<span style="color:var(--bad)">5.6.2 宿主实测会静默回落国内</span>——界面显示已选国际，实际扣的还是国内额度。别用，等会话切换方案。</div>
        <div>③ <b>分清当前窗口</b>：标题/任务栏 WorkBuddy=国内、WorkBuddy AI=国际；模型清单有 Primary/极致/GPT-6-Astra=国际，有"夜间折扣"=国内。</div>
        <div>④ <b>一键测试</b>：这个按钮两侧各发一条最小消息并对比账单，直接告诉你走哪个模型、扣哪边多少积分（自动挑免费模型）。</div>
      </div>
    </details>
    <p class="sub">
      按会话文件所在的数据目录判断归属。<strong>频率超限</strong>等重置即可；
      <strong>额度用尽</strong>要充值，不会自己恢复。
    </p>
    <div id="usage-body" style="margin-top:12px"></div>
  </section>


    </div>
    <div data-page="log" hidden>
  <section id="log-sec">
    <h2><svg class="ico-sm" aria-hidden="true"><use href="#i-term"/></svg>代理日志</h2>
    <p class="hint" style="margin-top:0">
      注入模式下模型跑在国内客户端里，客户端那边出问题只会给你一句报错
      （常常只剩一个状态码）；这里记的是<strong>本机代理真正做的事</strong>：
      每次请求的模型名、工具数、流式与否、上游状态码与耗时。
      同一份内容也写在 <code>%USERPROFILE%\.wbmux\gui.log</code>。
    </p>
    <p class="hint" style="margin-top:6px">
      只有一条「收到请求」而没有对应的「转发完成」＝ 卡在上游，还没回来。
      转发完成里会写明这次的上下文有多大（长会话能到十几 MB）。
    </p>
    <div id="live-session-card" style="margin:14px 0"></div>
    <div class="row" style="margin-top:12px">
      <button id="btn-log-refresh">刷新</button>
      <label class="check" style="margin:0">
        <input type="checkbox" id="log-live" checked>
        <span>每 2 秒自动刷新</span>
      </label>
      <span class="hint" id="log-summary" style="margin:0"></span>
    </div>
    <div id="log-body" style="margin-top:12px"></div>
  </section>

    </div>
    <div data-page="gateway" hidden>
      <section id="gateway-sec">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px">
          <div>
            <h2 style="margin:0 0 4px"><svg class="ico-sm" aria-hidden="true"><use href="#i-scan"/></svg>网关调用分析与实时审计</h2>
            <p class="hint" style="margin:0">
              精准捕获通过本机 <code>/v1/chat/completions</code> 代理的所有模型调用。全链路记录耗时、首字延迟 (TTFT)、Token 吞吐及 429 故障转移。
            </p>
          </div>
          <div class="row" style="margin:0">
            <button id="btn-gw-refresh" class="ghost" style="padding:5px 12px;font-size:12px"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-reload"/></svg>刷新</button>
            <button id="btn-gw-clear" class="ghost danger" style="padding:5px 12px;font-size:12px"><svg class="ico ico-sm" aria-hidden="true"><use href="#i-trash"/></svg>清空流水</button>
          </div>
        </div>

        <!-- 5 联核心 KPI 仪表卡片 -->
        <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));margin-bottom:16px" id="gw-kpi-container">
          <div class="kpi-card">
            <div class="kpi-head">
              <span class="kpi-title">累计调用 / 成功率</span>
              <span class="pill ok" id="gw-kpi-rate">100%</span>
            </div>
            <div class="kpi-num" id="gw-kpi-total">0 <span class="kpi-unit">次</span></div>
            <div class="kpi-foot" id="gw-kpi-status-foot">
              <span>成功 <b>0</b></span> · <span>失败 <b>0</b></span>
            </div>
          </div>

          <div class="kpi-card">
            <div class="kpi-head">
              <span class="kpi-title">Token 总吞吐</span>
              <span class="pill" style="color:var(--brand);border-color:rgba(99,179,196,0.3)">Tokens</span>
            </div>
            <div class="kpi-num" id="gw-kpi-tokens">0 <span class="kpi-unit">tok</span></div>
            <div class="kpi-foot" id="gw-kpi-tokens-foot">
              <span>输入 <b>0</b></span> · <span>输出 <b>0</b></span>
            </div>
          </div>

          <div class="kpi-card">
            <div class="kpi-head">
              <span class="kpi-title">平均首字延迟 (TTFT)</span>
              <span class="pill" style="color:#a78bfa;border-color:rgba(167,139,250,0.3)">Latency</span>
            </div>
            <div class="kpi-num" id="gw-kpi-ttft">0 <span class="kpi-unit">ms</span></div>
            <div class="kpi-foot" id="gw-kpi-duration-foot">
              <span>平均总用时 <b>0 ms</b></span>
            </div>
          </div>

          <div class="kpi-card">
            <div class="kpi-head">
              <span class="kpi-title">无感故障转移 (Failover)</span>
              <span class="pill ok" id="gw-kpi-failover-pill">全量健康</span>
            </div>
            <div class="kpi-num" id="gw-kpi-failover">0 <span class="kpi-unit">次换号</span></div>
            <div class="kpi-foot">
              <span class="pulse-dot"></span> <span>429/402 自动无感续杯</span>
            </div>
          </div>

          <div class="kpi-card">
            <div class="kpi-head">
              <span class="kpi-title">算力防抖吸收 (Jitter)</span>
              <span class="pill ok" id="gw-kpi-absorbed-pill">微抖动自适应</span>
            </div>
            <div class="kpi-num" id="gw-kpi-absorbed">0 <span class="kpi-unit">次化解</span></div>
            <div class="kpi-foot">
              <span class="pulse-dot" style="background:#38bdf8"></span> <span>14003 GPU 瞬态拥堵平滑化解</span>
            </div>

                <button type="button" id="btn-buddy-travel-action" class="primary" style="padding:4px 12px;font-size:11.5px;font-weight:600">
                  ✈️ 自动打理旅行
                </button>
                <span id="growth-guardian-badge" class="growth-task-tag" style="background:rgba(34,197,94,0.12);color:#22c55e;font-size:11px" title="后台全天候自适应守护运行中：到站自动收割积分并再次出发，每日首次登录自动静默扫荡">
                  🟢 后台自动收割中
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- 17项任务矩阵列表 -->
        <div style="margin-top:20px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <h3 style="font-size:13.5px;font-weight:650;color:var(--ink);margin:0">全量成长任务矩阵 (17项自动化 + 1项微信捐赠)</h3>
            <span style="font-size:11.5px;color:var(--ink-3)" id="growth-task-count">加载中…</span>
          </div>

          <!-- 分类筛选导航条与过滤开关 -->
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px">
            <div class="growth-filter-bar" id="growth-filter-tabs">
              <button type="button" class="growth-filter-btn active" data-filter="all">全部任务</button>
              <button type="button" class="growth-filter-btn" data-filter="daily">📅 每日可刷</button>
              <button type="button" class="growth-filter-btn" data-filter="once">🎁 一次性福利</button>
              <button type="button" class="growth-filter-btn" data-filter="milestone">📱 连续打卡</button>
            </div>
            <label style="font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none">
              <input type="checkbox" id="chk-growth-hide-claimed" style="margin:0">
              隐藏已入账任务（只看待办）
            </label>
          </div>

          <div id="growth-tasks-list" class="growth-task-grid">
            <div class="hint" style="grid-column:1/-1"><span class="spinner"></span> 正在拉取国内侧最新任务列表与进度…</div>
          </div>
        </div>
      </section>

      <section style="margin-top:20px">
        <h2><svg class="ico-sm" aria-hidden="true"><use href="#i-clock"/></svg>全自动化逆向原理与合规边界</h2>
        <p class="sub">
          <strong>为什么纯 API 就能点亮？</strong><br>
          官方判定任务完成的通道是 <code>POST /v2/report</code>。经过逆向 <code>app.asar</code> 与抓包解密，官方不同任务严格识别特定的客户端指纹（桌面端 5.5.6 事件族、Web 域元素点击、小程序专属请求头）。
          wbmux 将这些事件链原汁原味地封装为纯 API 流水，同时针对专家与技能类任务通过微秒级短会话从 SSE 流截取服务端真实会话 ID 注入回填，因此无需打开官方客户端即可完成。
        </p>
        <p class="sub">
          <strong>计分异步落账保护：</strong><br>
          官方服务端计分存在 3~8 秒异步延迟，wbmux 采用有界退避回读轮询，在落账后自动调用 <code>claim</code> 接口将积分与能量真正领到账号中，无需人工反复盯梢。
        </p>
      </section>
    </div>
    <div data-page="checkin" hidden>
  <section>
    <h2><svg class="ico-sm" aria-hidden="true"><use href="#i-calendar"/></svg>每日签到</h2>
    <p class="sub">
      连签会累计积分，断一天就归零。这一页读的是<strong>国内版账号</strong>——
      签到目前只在国内侧开放，国际侧接口在、活动没开。
    </p>
    <p class="sub">
      <strong>打开 wbmux 就自动签了</strong>，不用切到这一页——先查状态，
      只有今天还没签才领；已签过就只记下状态、不再重复领。
      这一页是给你看结果的：今天签没签、连了几天、还剩多少。
    </p>
    <div class="row" style="margin-top:14px">
      <button id="btn-checkin-refresh">刷新状态</button>
      <button class="primary" id="btn-checkin-claim" disabled>领取今日积分</button>
      <label class="hint" style="margin:0;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="chk-checkin-auto" style="margin:0">
        打开界面时自动签到
      </label>
    </div>
    <div id="checkin-auto-note" style="margin-top:10px"></div>
    <div id="checkin-body" style="margin-top:14px"></div>
  </section>
  <section style="margin-top:24px">
    <h2><svg class="ico-sm" aria-hidden="true" style="color:var(--brand)"><use href="#i-zap"/></svg>国际版每日活跃打卡 (次日自动发放 +30 积分)</h2>
    <p class="sub">
      国际版（WorkBuddy / CodeBuddy International）不设静态签到接口，而是通过<strong>每日有效桌面问答会话</strong>核算活跃度。官方在次日凌晨跑批统一发放 <strong>+30 积分</strong>，并累计连续活跃进度（可阶梯兑换 50~150 积分）。
    </p>
    <p class="sub">
      如果你当天未通过客户端对话，或自选模型未走官方桌面链路，可在此<strong>完整跑一次模拟对话</strong>：后端将携带官方 8 大桌面身份头，自动动态匹配当前官方免积分模型（如 <code>hy4free</code> 等），完整走完流式交互并上报 6 项遥测事件闭环。
    </p>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="btn-checkin-intl-simulate" style="background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff">
        <svg class="ico ico-sm" aria-hidden="true"><use href="#i-zap"/></svg> 模拟今日活跃对话 (+30 积分)
      </button>
      <span class="hint" id="checkin-intl-simulate-hint" style="margin:0"></span>
    </div>
    <div id="checkin-intl-simulate-box" style="margin-top:14px" hidden></div>
  </section>
  <section>
    <h2><svg class="ico-sm" aria-hidden="true"><use href="#i-clock"/></svg>自动签到的边界</h2>
    <p class="sub">
      自动签到会<strong>改账号状态</strong>（领积分、改连签天数），是 wbmux 里少数几个
      会写远端的地方，所以它的行为被限制得很死：
    </p>
    <p class="sub">
      <strong>只在「今天还没签」时才领。</strong>已签过、没开活动、或者状态根本查不到
      （没登录 / 断网），都<strong>一个请求都不发</strong>——宁可什么都不做，也不在
      看不清状态的时候乱改账号。判断放在服务端做，不靠页面自己算。
    </p>
    <p class="sub">
      <strong>每天会自己刷新。</strong>「今天签了没」由后端按自然日判定，跨过午夜就
      自动变成"没签"，第二天打开界面会重新领——不需要你做任何事，也不需要 wbmux
      常驻后台。
    </p>
    <p class="sub">
      不想要自动的，把上面的勾去掉。关掉之后连一次查询都不会发。
      想在固定时刻领（比如每天 9 点），用命令行 <code>wbmux checkin claim</code>
      交给系统任务计划程序，它同样是幂等的：签过就如实回报，不会重复领也不会报错。
    </p>
  </section>
    </div>
    <div data-page="recycle" hidden>
  <section>
    <h2><svg class="ico-sm" aria-hidden="true"><use href="#i-trash"/></svg>回收站清理</h2>
    <p class="sub">
      按<strong>能不能放心删</strong>分成三档。卡死的原因是<strong>条目数</strong>而不是体积——
      资源管理器要逐个读元数据才能画出列表，几千条就转不动了。
      每档都能单独清，越往下越危险；自动清理只碰第一档。
    </p>
    <div class="row" style="margin-top:14px">
      <button id="btn-recycle-scan">重新扫描</button>
      <span class="hint" id="recycle-note" style="margin:0"></span>
    </div>
    <div id="recycle-body" style="margin-top:14px"></div>
  </section>
  <section>
    <h2><svg class="ico-sm" aria-hidden="true"><use href="#i-clock"/></svg>自动清理</h2>
    <p class="sub">
      开启后每 30 分钟自动清一次<strong>已识别的噪声</strong>，绝不碰你自己删的文件。
      开关会记住，下次打开界面仍然有效。
      <br>
      <span class="desc">注意：wbmux 进程不开着的时候它不会运行——关掉界面就等于停了。
      想让它常驻，把 wbmux 留着别关。</span>
    </p>
    <label class="check">
      <input type="checkbox" id="recycle-auto">
      <span>自动清理噪声
        <span class="desc" id="recycle-auto-state"></span>
      </span>
    </label>
  </section>
</div>

<div data-page="websearch" hidden>
  <section>
    <h2><svg class="ico-sm" aria-hidden="true"><use href="#i-search"/></svg>全网实时联网搜索服务 (Web Search Proxy)</h2>
    <p class="sub">
      wbmux 内置了官方标准全网联网搜索反代端点，通过复用已登录的客户端凭据，
      为第三方开发工具（如 <strong>ZCode、Claude Code、Cline、Cherry Studio</strong> 等）提供<strong>零成本、免复杂配置、高时效性的全网实时检索</strong>。
    </p>

    <!-- 协议与端点配置指引卡片 -->
    <div class="card" style="margin-top:14px;padding:16px 20px">
      <div class="card-head" style="margin-bottom:10px">
        <span class="card-title" style="display:flex;align-items:center;gap:6px">
          <svg class="ico-sm" style="color:var(--brand)" aria-hidden="true"><use href="#i-server"/></svg>
          外部客户端接入协议与端点
        </span>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px 14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:12.5px;font-weight:600;color:var(--ink-1)">1. Anthropic Messages 协议端点（推荐：ZCode / Claude Code / Cline）</span>
            <span class="growth-task-tag" style="background:rgba(59,130,246,0.15);color:#3b82f6;font-size:11px">支持 web_search 工具协议</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <code id="txt-search-endpoint-messages" style="flex:1;background:rgba(255,255,255,0.05);padding:6px 10px;border-radius:6px;font-size:12px;color:var(--brand)">http://127.0.0.1:18789/v1/search/messages</code>
            <button type="button" class="ghost" id="btn-copy-search-messages" style="font-size:11px;padding:4px 10px">复制端点</button>
          </div>
          <p class="hint" style="margin:0;font-size:11.5px;color:var(--ink-2)">
            在客户端中声明 <code>web_search</code> 工具即可自动调用。认证头支持 <code>x-api-key: &lt;当前Token&gt;</code> 或 <code>Authorization: Bearer &lt;当前Token&gt;</code>；<b>本机回环（127.0.0.1 / ::1）完全免密，认证头可留空</b>——对接不支持填 Key 的客户端时直接留空即可。
          </p>
        </div>

        <div style="background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px 14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:12.5px;font-weight:600;color:var(--ink-1)">2. 极简结构化 JSON 搜索端点（脚本 / 浏览器插件 / 自定义扩展）</span>
            <span class="growth-task-tag" style="background:rgba(168,85,247,0.15);color:#a855f7;font-size:11px">GET / POST JSON</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <code id="txt-search-endpoint-native" style="flex:1;background:rgba(255,255,255,0.05);padding:6px 10px;border-radius:6px;font-size:12px;color:var(--brand)">http://127.0.0.1:18789/v1/search?q=关键词&amp;n=5</code>
            <button type="button" class="ghost" id="btn-copy-search-native" style="font-size:11px;padding:4px 10px">复制端点</button>
          </div>
          <p class="hint" style="margin:0;font-size:11.5px;color:var(--ink-2)">
            直接通过 GET/POST 查询，响应为包含 <code>title</code>、<code>url</code>、<code>snippet</code>、<code>response_time_ms</code> 的原生标准 JSON。
          </p>
        </div>

        <div style="background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px 14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:12.5px;font-weight:600;color:var(--ink-1)">3. Anthropic Messages 网关端点（把 wbmux 当主端点用）</span>
            <span class="growth-task-tag" style="background:rgba(74,222,128,0.15);color:#4ade80;font-size:11px">聊天 + 搜索 一站分流</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <code id="txt-search-endpoint-gateway" style="flex:1;background:rgba(255,255,255,0.05);padding:6px 10px;border-radius:6px;font-size:12px;color:var(--brand)">http://127.0.0.1:18789/v1/messages</code>
            <button type="button" class="ghost" id="btn-copy-search-gateway" style="font-size:11px;padding:4px 10px">复制端点</button>
          </div>
          <p class="hint" style="margin:0;font-size:11.5px;color:var(--ink-2)">
            带 <code>web_search</code> 工具的请求走上面的免费联网搜索；其余聊天请求透传到环境变量
            <code>WBMUX_GATEWAY_UPSTREAM</code> 配置的上游模型端点（Anthropic Messages 兼容，如 StepFun / GLM / DeepSeek），
            上游密钥用 <code>WBMUX_GATEWAY_API_KEY</code> 配置。这样任意自定义模型都能零成本获得原生联网搜索，普通对话不受影响。
            客户端把该地址填为 Base URL、并在模型能力里打开「原生联网搜索」即可。
          </p>
        </div>
      </div>
    </div>

    <!-- 在线即时搜索测试台 -->
    <div class="card" style="margin-top:14px;padding:16px 20px">
      <div class="card-head" style="margin-bottom:12px">
        <span class="card-title" style="display:flex;align-items:center;gap:6px">
          <svg class="ico-sm" style="color:var(--brand)" aria-hidden="true"><use href="#i-scan"/></svg>
          全网实时搜索在线测试台
        </span>
      </div>

      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
        <input type="text" id="ipt-search-query" placeholder="输入搜索词（例如：Go 1.24 新特性重大变更）..." style="flex:1;padding:8px 12px;font-size:13px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.25);color:var(--ink-0)">
        <select id="sel-search-limit" style="width:110px;padding:8px;font-size:12px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.25);color:var(--ink-1)">
          <option value="3">获取 3 条</option>
          <option value="5" selected>获取 5 条</option>
          <option value="10">获取 10 条</option>
        </select>
        <button type="button" id="btn-run-search" class="primary" style="padding:8px 18px;font-size:13px">
          <svg class="ico-sm" aria-hidden="true"><use href="#i-search"/></svg>立即检索
        </button>
      </div>

      <div id="search-status-bar" style="display:none;margin-bottom:12px;font-size:12px;color:var(--ink-2)"></div>
      <div id="search-results-list" style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:12px;color:var(--ink-3);padding:16px 0;text-align:center">
          输入搜索词并点击「立即检索」，即可验证全网实时搜索与摘要提取效果。
        </div>
      </div>
    </div>
  </section>
</div>
  </main>
</div>

</div>
